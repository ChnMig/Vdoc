  schemas:
    VdocEnvelope:
      type: object
      required: [code, status, description, timestamp]
      properties:
        code:
          type: integer
          description: Semantic status code carried in the body.
          example: 200
        status:
          type: string
          description: Semantic status string such as OK, INVALID_ARGUMENT, or UNAUTHENTICATED.
          example: OK
        description:
          type: string
          description: Stable status description.
          example: No error
        message:
          type: string
          description: Optional user-facing message, usually present on errors.
        trace_id:
          type: string
          description: Optional request trace ID set by middleware.
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in seconds.
        detail:
          description: Optional success payload or structured error detail.
        total:
          type: integer
          description: Optional total count. Present on endpoints using ReturnOkWithTotal.
      examples:
        - code: 200
          status: OK
          description: No error
          trace_id: req-123
          timestamp: 1780000000
          detail: {}
        - code: 400
          status: INVALID_ARGUMENT
          description: Client specified an invalid argument
          message: invalid request body
          trace_id: req-123
          timestamp: 1780000000

        - required: [schema_content]
        - required: [content]
      properties:
        branch_id: { type: string }
        version_name: { type: string, minLength: 1 }
        changelog: { type: string }
        source_branch_id: { type: string, description: Optional published source branch within this document. }
        source_version_id: { type: string, description: Optional published starting version within this document. }
        source_git_commit_id: { type: string }
        schema_content:
          type: string
          description: OpenAPI source content. The handler also accepts this field for Markdown and TXT clients.
        content:
          type: string
          description: Markdown or TXT source content; used when schema_content is empty. Empty TXT content is valid, but missing or null content is invalid.
    PatchDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      anyOf:
        - required: [schema_content]
        - required: [content]
      properties:
        expected_revision:
          type: string
          minLength: 1
          description: Opaque revision returned with the draft snapshot. Stale revisions fail with FAILED_PRECONDITION; reload and reconcile edits before retrying.
        version_name: { type: string, minLength: 1 }
        changelog: { type: string }
        source_git_commit_id: { type: string }
        schema_content:
          type: string
          description: Updated OpenAPI source content. The handler also accepts this field for Markdown and TXT clients.
        content:
          type: string
          description: Updated Markdown or TXT source content; used when schema_content is empty. Empty TXT content clears the file, while missing or null content is invalid.
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [expected_review_revision]
      properties:
        expected_review_revision:
          type: string
          minLength: 1
          description: Opaque detail.draft.review_revision from the content snapshot the reviewer inspected. Binds content, submission round, and latest branch diff baseline. Stale snapshots return FAILED_PRECONDITION; reload and review again before retrying.
        comment: { type: string, maxLength: 1000 }
    PromoteDraftRequest:
      type: object
      additionalProperties: false
      required: [source_branch_id, target_branch_id, version_name]
      properties:

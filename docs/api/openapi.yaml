      summary: List authorized audit history.
      description: Super administrators may query all projects. Project administrators must supply project_id and can query only projects they administer. Reader and writer roles are denied. Results are newest first and capped at 200.
      operationId: listAuditLogs
      security: [{ JWTAuth: [] }]
      parameters:
        - {
            name: project_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - { name: action, in: query, required: false, schema: { type: string } }
        - {
            name: resource_type,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: resource_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200, default: 100 },
          }

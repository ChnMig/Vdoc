openapi: 3.1.0
info:
  title: Vdoc API
  version: 0.1.0
  description: Machine-readable contract for the Vdoc v0.1 HTTP API. REST handlers return HTTP 200 with the semantic result in the Vdoc envelope body. The MCP endpoint also accepts JSON-RPC 2.0 requests secured by an MCP token in the Authorization header.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security: []
tags:
  - name: Open
    description: Public health, authentication, docs, and MCP entry points.
  - name: Identity
    description: Current user identity.
  - name: System Users
    description: Super admin user lifecycle and user MCP token oversight.
  - name: Teams
    description: Team lifecycle.
  - name: Projects
    description: Project lifecycle and membership.
  - name: Services
    description: API service lifecycle.
  - name: Branches
    description: Service branch lifecycle.
  - name: Contracts
    description: Published API contract versions and stored schemas.
  - name: Drafts
    description: Contract draft creation, update, review, and promotion.
  - name: Endpoints
    description: Parsed endpoint data from published contracts.
  - name: Diffs
    description: Semantic API version comparison.
  - name: MCP Tokens
    description: User MCP token lifecycle.
paths:
  /api/v1/open/health:
    get:
      tags: [Open]
      summary: Get service health.
      operationId: getOpenHealth
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/open/auth/register:
    post:
      tags: [Open]
      summary: Register a user and issue a JWT.
      operationId: registerAuth
      requestBody:
        $ref: '#/components/requestBodies/RegisterRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/open/auth/login:
    post:
      tags: [Open]
      summary: Authenticate a user and issue a JWT.
      operationId: loginAuth
      requestBody:
        $ref: '#/components/requestBodies/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/open/docs/openapi.yaml:
    get:
      tags: [Open]
      summary: Serve this OpenAPI YAML document.
      operationId: getOpenAPISpec
      responses:
        '200':
          $ref: '#/components/responses/OpenAPISpecResponse'
  /api/v1/open/mcp:
    post:
      tags: [Open]
      summary: Call MCP tools through JSON-RPC 2.0.
      operationId: callMCP
      security:
        - MCPTokenAuth: []
      requestBody:
        $ref: '#/components/requestBodies/MCPJSONRPCRequest'
      responses:
        '200':
          $ref: '#/components/responses/MCPJSONRPCResponse'
  /api/v1/private/identity/me:
    get:
      tags: [Identity]
      summary: Get the current user.
      operationId: getIdentityMe
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/system/users:
    get:
      tags: [System Users]
      summary: List system users.
      operationId: listSystemUsers
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
    post:
      tags: [System Users]
      summary: Create a system user.
      operationId: createSystemUser
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/system/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    patch:
      tags: [System Users]
      summary: Update system user status or super admin flag.
      operationId: patchSystemUser
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PatchUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/system/users/{user_id}/mcp-tokens:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [System Users]
      summary: List MCP tokens for a system user.
      operationId: listSystemUserMCPTokens
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
  /api/v1/private/system/users/{user_id}/mcp-tokens/{token_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/TokenID'
    post:
      tags: [System Users]
      summary: Revoke a system user's MCP token.
      operationId: revokeSystemUserMCPToken
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/teams:
    get:
      tags: [Teams]
      summary: List teams.
      operationId: listTeams
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
    post:
      tags: [Teams]
      summary: Create a team.
      operationId: createTeam
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TeamRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/teams/{team_id}:
    parameters:
      - $ref: '#/components/parameters/TeamID'
    get:
      tags: [Teams]
      summary: Get a team.
      operationId: getTeam
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
    patch:
      tags: [Teams]
      summary: Update a team.
      operationId: updateTeam
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TeamRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/teams/{team_id}/archive:
    parameters:
      - $ref: '#/components/parameters/TeamID'
    post:
      tags: [Teams]
      summary: Archive a team.
      operationId: archiveTeam
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects:
    get:
      tags: [Projects]
      summary: List projects visible to the current user.
      operationId: listProjects
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
    post:
      tags: [Projects]
      summary: Create a project.
      operationId: createProject
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ProjectRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Projects]
      summary: Get a project.
      operationId: getProject
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
    patch:
      tags: [Projects]
      summary: Update a project.
      operationId: updateProject
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ProjectUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [Projects]
      summary: Archive a project.
      operationId: archiveProject
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Projects]
      summary: List project members.
      operationId: listProjectMembers
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
    post:
      tags: [Projects]
      summary: Add a project member.
      operationId: addProjectMember
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ProjectMemberCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/UserID'
    delete:
      tags: [Projects]
      summary: Remove a project member.
      operationId: removeProjectMember
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/members/{user_id}/role:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/UserID'
    patch:
      tags: [Projects]
      summary: Change a project member role.
      operationId: patchProjectMemberRole
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ProjectMemberRoleRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Services]
      summary: List services in a project.
      operationId: listProjectServices
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
    post:
      tags: [Services]
      summary: Create a service in a project.
      operationId: createProjectService
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ServiceRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
    get:
      tags: [Services]
      summary: Get a service.
      operationId: getProjectService
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
    patch:
      tags: [Services]
      summary: Update a service.
      operationId: updateProjectService
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ServiceRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
    post:
      tags: [Services]
      summary: Archive a service.
      operationId: archiveProjectService
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/branches:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
    get:
      tags: [Branches]
      summary: List service branches.
      operationId: listServiceBranches
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
    post:
      tags: [Branches]
      summary: Create a service branch.
      operationId: createServiceBranch
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/BranchRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/branches/{branch_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/BranchID'
    get:
      tags: [Branches]
      summary: Get a service branch.
      operationId: getServiceBranch
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
    patch:
      tags: [Branches]
      summary: Update a service branch.
      operationId: updateServiceBranch
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/BranchPatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/branches/{branch_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/BranchID'
    post:
      tags: [Branches]
      summary: Archive a service branch.
      operationId: archiveServiceBranch
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contracts:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
    get:
      tags: [Contracts]
      summary: List published contract versions for a service.
      operationId: listContracts
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contracts/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/VersionID'
    get:
      tags: [Contracts]
      summary: Get a published contract version.
      operationId: getContract
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contracts/{version_id}/schemas/{schema_kind}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/VersionID'
      - $ref: '#/components/parameters/SchemaKind'
    get:
      tags: [Contracts]
      summary: Get raw or normalized schema content for a published version.
      operationId: getContractSchema
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contract-drafts:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
    get:
      tags: [Drafts]
      summary: List contract drafts for a service.
      operationId: listContractDrafts
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
    post:
      tags: [Drafts]
      summary: Create a contract draft from schema content.
      operationId: createContractDraft
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/DraftRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contract-drafts/{draft_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/DraftID'
    get:
      tags: [Drafts]
      summary: Get a contract draft.
      operationId: getContractDraft
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
    patch:
      tags: [Drafts]
      summary: Update a contract draft before review.
      operationId: updateContractDraft
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/DraftRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contract-drafts/{draft_id}/schemas/{schema_kind}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/DraftID'
      - $ref: '#/components/parameters/SchemaKind'
    get:
      tags: [Drafts]
      summary: Get raw or normalized schema content for a draft.
      operationId: getContractDraftSchema
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contract-drafts/{draft_id}/submit:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/DraftID'
    post:
      tags: [Drafts]
      summary: Submit a contract draft for review.
      operationId: submitContractDraft
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contract-drafts/{draft_id}/approve:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/DraftID'
    post:
      tags: [Drafts]
      summary: Approve a submitted draft and create a published version.
      operationId: approveContractDraft
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contract-drafts/{draft_id}/request-changes:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/DraftID'
    post:
      tags: [Drafts]
      summary: Request changes on a submitted draft.
      operationId: requestContractDraftChanges
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contract-drafts/{draft_id}/reject:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/DraftID'
    post:
      tags: [Drafts]
      summary: Reject a submitted draft.
      operationId: rejectContractDraft
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contract-drafts/promote:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
    post:
      tags: [Drafts]
      summary: Promote schema content from one branch into a draft on another branch.
      operationId: promoteContractDraft
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PromoteDraftRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contracts/{version_id}/endpoints:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/VersionID'
    get:
      tags: [Endpoints]
      summary: List parsed endpoints for a contract version.
      operationId: listContractEndpoints
      security:
        - JWTAuth: []
      parameters:
        - name: path
          in: query
          required: false
          description: Optional endpoint path filter.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/contracts/{version_id}/endpoints/{endpoint_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/VersionID'
      - $ref: '#/components/parameters/EndpointID'
    get:
      tags: [Endpoints]
      summary: Get parsed endpoint detail.
      operationId: getContractEndpoint
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/diffs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
    post:
      tags: [Diffs]
      summary: Compare two published contract versions.
      operationId: createDiff
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/DiffCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/diffs/{diff_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/DiffID'
    get:
      tags: [Diffs]
      summary: Get a semantic diff.
      operationId: getDiff
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/projects/{project_id}/services/{service_id}/diffs/{diff_id}/summary:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ServiceID'
      - $ref: '#/components/parameters/DiffID'
    get:
      tags: [Diffs]
      summary: Get the semantic diff summary only.
      operationId: getDiffSummary
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/mcp-tokens:
    get:
      tags: [MCP Tokens]
      summary: List MCP tokens for the current user.
      operationId: listMCPTokens
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocListEnvelopeResponse'
    post:
      tags: [MCP Tokens]
      summary: Create an MCP token.
      operationId: createMCPToken
      security:
        - JWTAuth: []
      requestBody:
        $ref: '#/components/requestBodies/MCPTokenCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/mcp-tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/TokenID'
    get:
      tags: [MCP Tokens]
      summary: Get MCP token metadata.
      operationId: getMCPToken
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
  /api/v1/private/mcp-tokens/{token_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/TokenID'
    post:
      tags: [MCP Tokens]
      summary: Revoke an MCP token.
      operationId: revokeMCPToken
      security:
        - JWTAuth: []
      responses:
        '200':
          $ref: '#/components/responses/VdocEnvelopeResponse'
components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw JWT string issued by the login or register endpoint.
    MCPTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw MCP token string issued by the MCP token APIs.
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: Project ID.
    ServiceID:
      name: service_id
      in: path
      required: true
      schema:
        type: string
      description: Service ID.
    BranchID:
      name: branch_id
      in: path
      required: true
      schema:
        type: string
      description: Branch ID.
    DraftID:
      name: draft_id
      in: path
      required: true
      schema:

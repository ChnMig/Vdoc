      tags: [AI]
      summary: Explicitly reveal the saved AI provider API key.
      description: SuperAdmin only. Reveals the saved system key. Records a secret-free audit before returning detail.api_key. Responses use Cache-Control no-store; ordinary provider DTOs remain redacted.
      operationId: revealSystemAIProviderKey
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/provider/key/reveal:
    parameters:

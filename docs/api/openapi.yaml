  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts/{draft_id}/ai-summary/regenerate:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/DocumentID" }
      - { $ref: "#/components/parameters/DraftID" }
    post:
      tags: [AI]
      summary: Regenerate an AI summary for a draft.
      description: Queues a durable background generation and returns pending immediately (or skipped when no provider is configured). Poll the matching GET endpoint until succeeded, failed, or skipped. Repeated regeneration while pending reuses the existing job.
      operationId: regenerateDraftAISummary
      security: [{ JWTAuth: [] }]
      responses:

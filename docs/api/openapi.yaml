  /api/v1/private/projects/{project_id}/ai/chat-sessions:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      tags: [AI]
      summary: List AI chat sessions for an exact document, draft, version, or diff context.
      description: Returns retained sessions newest-updated first, including after the Project, Document, or target Branch is archived.
      operationId: listAIChatSessions
      security: [{ JWTAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AIChatDocumentIDQuery" }
        - { $ref: "#/components/parameters/AIChatContextTypeQuery" }
        - { $ref: "#/components/parameters/AIChatContextIDQuery" }
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [AI]
      summary: Create an AI chat session scoped to a document, draft, version, or diff.
      description: Requires an active Project, Document, and target Branch. Existing sessions remain readable after archive.
      operationId: createAIChatSession
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIChatSessionRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/chat-sessions/{session_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/AIChatSessionID" }
    get:
      tags: [AI]
      summary: Get an AI chat session and messages.
      operationId: getAIChatSession
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
    patch:
      tags: [AI]
      summary: Save the conversation reasoning effort.
      description: Empty string follows the configured model; none explicitly disables reasoning. Supported effort values depend on the provider/model. Rejects changes during a reply. Requires an active target and project read access.
      operationId: updateAIChatReasoning
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIChatReasoningRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/chat-sessions/{session_id}/title:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/AIChatSessionID" }
    post:
      tags: [AI]
      summary: Generate a short conversation title after the first completed turn.
      description: Idempotent after success. Uses bounded excerpts and attachment names, never attachment contents. A separate provider request with a 20-second cap; failure leaves the existing title and messages intact. Requires active target and project read access.
      operationId: generateAIChatTitle
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/chat-sessions/{session_id}/messages:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/AIChatSessionID" }
    post:
      tags: [AI]
      summary: Send a message in a page-scoped AI chat session.
      description: Send Accept text/event-stream to receive provisional delta and provider-visible reasoning events, plus context events while older history is summarized. The done envelope contains the committed assistant message with optional reasoning and retry_of; error envelopes may include safe detail.ai_error diagnostics. EOF without done is failure. Set retry_of to the latest effective assistant ID with empty content and no attachments to regenerate its original question; success appends a replacement answer without duplicating the user message. Original messages remain stored. Session reads include context_summary_count and optional context_compacted_at. Clients without this Accept header receive JSON envelopes.
      operationId: sendAIChatMessage
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIChatMessageRequest" }
      responses:
        "200": { $ref: "#/components/responses/AIChatMessageResponse" }
  /api/v1/private/mcp-tokens:
    get:
      tags: [MCP Tokens]
      summary: List MCP tokens.
      operationId: listMCPTokens
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [MCP Tokens]
      summary: Create MCP token.
      description: Returns a copyable token on create. At least one explicit scope is required, and expires_at must be in the future when supplied. The owner can reveal an active token again with the detail endpoint; list, revoked, and expired responses are redacted.
      operationId: createMCPToken
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMCPTokenRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/mcp-usage:
    get:
      tags: [MCP Tokens]
      summary: List sanitized MCP tool activity.
      description: Returns newest-first `mcp.tool_call` audit evidence for MCP tokens owned by the authenticated user. Supplying `token_id` selects one owned token; a SuperAdmin may use that parameter to inspect any user's token. Without `token_id`, even a SuperAdmin sees only activity for their own tokens. Results default to 100 and are capped at 200. Metadata is allowlisted to tool/adapter/result/reason plus referenced entity IDs and token ID. Entity IDs are retained only for successful tool calls, so caller-supplied IDs from failed requests cannot become entity evidence. IP address and User-Agent are removed, and raw token secrets, schemas, Markdown content, and request arguments are never returned.
      operationId: listMCPUsage
      security: [{ JWTAuth: [] }]
      parameters:
        - {
            name: token_id,
            in: query,
            required: false,
            schema: { type: string },
            description: MCP token ID. Non-SuperAdmins may select only a token they own.,
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200, default: 100 },
          }
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
  /api/v1/private/mcp-tokens/{token_id}:
    parameters:
      - { $ref: "#/components/parameters/TokenID" }
    get:
      tags: [MCP Tokens]
      summary: Get MCP token.
      operationId: getMCPToken
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/mcp-tokens/{token_id}/revoke:
    parameters:
      - { $ref: "#/components/parameters/TokenID" }
    post:
      tags: [MCP Tokens]
      summary: Revoke MCP token.
      operationId: revokeMCPToken
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/repository/ai/analyses:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    get:
      tags:
      - Repository Automation
      summary: List immutable commit analysis history.
      description: Requires current project read access. Results retain exact input
        commit IDs when branch HEAD changes.
      operationId: listRepositoryAnalyses
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryAnalysesEnvelope"
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Exclusive record sequence cursor. Use the last returned sequence;
          pages contain at most 100 records.
    post:
      tags:
      - Repository Automation
      summary: Analyze an exact commit or comparison.
      description: Synchronous explicit AI request, independent of content saves and
        publication. Omitted from_commit_id selects the first parent, or the root snapshot
        for a parentless commit. Evidence is bounded to 128 KiB and 32 changed files;
        evidence_truncated discloses omissions. The server generates the analysis ID
        and persists succeeded or failed results. User, token, provider and prompt configuration
        are rechecked transactionally before success. Interrupted running requests expire
        after ten minutes. Retry creates a new analysis against the same immutable commit
        IDs. A message asks a question about these sources; the service does not generate
        or apply patches.
      operationId: createRepositoryAnalysis
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryAnalysisEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositoryAnalysisRequest"
  /api/v1/private/projects/{project_id}/repository/ai/analyses/{analysis_id}:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: analysis_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Repository Automation
      summary: Get one saved commit analysis.
      description: Requires current project read access. Input IDs, source hashes and
        input_fingerprint identify fixed sources.
      operationId: getRepositoryAnalysis
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryAnalysisEnvelope"
  /api/v1/private/projects/{project_id}/repository/subscriptions:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    get:
      tags:
      - Repository Automation
      summary: List project event subscriptions.
      description: Project administrators only. At most 100 subscriptions per project.
        Signing secret plaintext and ciphertext are never returned by this endpoint.
      operationId: listRepositorySubscriptions
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositorySubscriptionsEnvelope"
    post:
      tags:
      - Repository Automation
      summary: Create a durable event subscription.
      description: Project administrators only. Starts after the current event sequence.
        Empty event_types defaults to release.published; * matches all events. Optional
        branch_id and document_id narrow delivery. in_app stores an administrative notification
        ledger entry. webhook requires a public HTTPS URL; its server-generated signing
        secret is returned only once. Private, loopback and metadata destinations are
        blocked at configuration and connection time. Redirects are never followed.
        At-least-once delivery uses X-Vdoc-Event-ID for deduplication. X-Vdoc-Signature
        is sha256=hex(HMAC-SHA256(secret, X-Vdoc-Timestamp + "." + raw request body)).
        External delivery never blocks or rolls back content commits.
      operationId: createRepositorySubscription
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryCreatedSubscriptionEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositorySubscriptionRequest"
  /api/v1/private/projects/{project_id}/repository/subscriptions/{subscription_id}/pause:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: subscription_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository Automation
      summary: Pause an event subscription.
      description: Project administrators only. Pausing retains the cursor; resuming
        catches up retained events. Losing creator administration access pauses the
        subscription and marks its due delivery failed.
      operationId: pauseRepositorySubscription
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositorySubscriptionEnvelope"
  /api/v1/private/projects/{project_id}/repository/subscriptions/{subscription_id}/resume:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: subscription_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository Automation
      summary: Resume an event subscription.
      description: Project administrators only. Pausing retains the cursor; resuming
        catches up retained events. Losing creator administration access pauses the
        subscription and marks its due delivery failed.
      operationId: resumeRepositorySubscription
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositorySubscriptionEnvelope"
  /api/v1/private/projects/{project_id}/repository/event-deliveries:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    get:
      tags:
      - Repository Automation
      summary: List the durable event delivery ledger.
      description: Project administrators only. event_sequence identifies the source
        event; sequence is the delivery cursor. A worker runs every three seconds. Transport
        failures, HTTP 408, 429 and 5xx retry up to eight attempts with exponential
        backoff. Other failures, including redirects, do not retry automatically. A
        two-minute processing lease permits interruption recovery.
      operationId: listRepositoryEventDeliveries
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryDeliveriesEnvelope"
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Exclusive record sequence cursor. Use the last returned sequence;
          pages contain at most 100 records.
  /api/v1/private/projects/{project_id}/repository/event-deliveries/{delivery_id}/retry:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: delivery_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository Automation
      summary: Retry a failed delivery with its original event ID.
      description: Project administrators only. Resets a failed delivery to pending
        and attempt count to zero. Event identity and payload remain fixed. A paused
        subscription stays paused.
      operationId: retryRepositoryEventDelivery
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; errors use body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryDeliveryEnvelope"
  /api/v1/private/projects/{project_id}/repository/branches:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    get:
      tags:
      - Repository
      summary: List project branches and legacy import state.
      operationId: listRepositoryBranches
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryBranchListEnvelope"
      description: Lazily creates only the protected empty main/genesis for a new repository.
        import_required=true means legacy drafts or versions exist and an administrator
        must explicitly bootstrap before repository content writes. Metadata-only old
        documents do not require import.
    post:
      tags:
      - Repository
      summary: Create a branch from a fixed commit.
      operationId: createRepositoryBranch
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryBranchEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositoryBranchInput"
      description: Writers may create working branches. Creating a protected branch
        requires project administration. No client commit or version identifier is accepted.
  /api/v1/private/projects/{project_id}/repository/bootstrap:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    post:
      tags:
      - Repository
      summary: Import every provable legacy snapshot without rewriting old data.
      operationId: bootstrapRepository
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryBranchListEnvelope"
      description: Administrator only, explicit one-time operation. Every available
        old published version and current unpublished draft receives a protected legacy
        reference. The initial main tree is explicitly marked synthetic; historical
        atomic project trees or overwritten draft saves are not invented. Legacy published
        paths are preserved when recorded. Old tables and public links remain readable.
        New legacy content writes are refused once conversion commits.
  /api/v1/private/projects/{project_id}/repository/commits:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    get:
      tags:
      - Repository
      summary: Read bounded first-parent branch or document history.
      operationId: listRepositoryCommits
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryHistoryEnvelope"
          headers:
            X-Next-Cursor:
              schema:
                type: string
              description: Next scan node when more history remains.
      description: Use page=true for {commits,next_cursor}; an empty filtered page may
        still have next_cursor. At most 50 results or 2000 scanned nodes per page. Feed
        back the exact server cursor until empty. The default array format remains for
        compatibility and also exposes X-Next-Cursor. Full file metadata is included;
        raw bodies use the content endpoint.
      parameters:
      - name: branch_id
        in: query
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{32}$"
      - name: document_id
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: boolean
          default: false
  /api/v1/private/projects/{project_id}/repository/branches/{branch_id}/commits:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: branch_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository
      summary: Atomically commit changed files with server-generated identity.
      operationId: saveRepositoryCommit
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryCommitEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositorySaveInput"
      description: All changes form one immutable complete tree. The server generates
        the SHA-256 commit ID and new document IDs (omit document_id for a new upsert).
        Original UTF-8 bytes, including CRLF, are retained. Expected HEAD+generation
        prevent lost updates; stale writes return FAILED_PRECONDITION with REF_CONFLICT.
        The same idempotency key and identical request return the original commit, including
        after later saves; changing the request under that key is INVALID_ARGUMENT.
        Protected branches require a reviewed merge request. LEGACY_IMPORT_REQUIRED
        prevents bypassing legacy import. No version_name input exists.
  /api/v1/private/projects/{project_id}/repository/commits/{commit_id}:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: commit_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Repository
      summary: Read an immutable complete commit snapshot.
      operationId: getRepositoryCommit
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryCommitEnvelope"
  /api/v1/private/projects/{project_id}/repository/commits/{commit_id}/documents/{document_id}/content:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: commit_id
      in: path
      required: true
      schema:
        type: string
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Repository
      summary: Read exact stored content from a fixed commit.
      operationId: getRepositoryCommitContent
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryContentEnvelope"
  /api/v1/private/projects/{project_id}/repository/comparisons:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    post:
      tags:
      - Repository
      summary: Compare raw content and OpenAPI semantics between fixed commits.
      operationId: compareRepositoryCommits
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryComparisonEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositoryCompareInput"
      description: At most 100 changed files and 8 MiB cumulative old/new source bytes.
        Larger comparisons return FAILED_PRECONDITION with COMPARISON_LIMIT; select
        document_id to narrow the comparison. Invalid OpenAPI remains committed and
        source-comparable with semantic_status=invalid; it cannot be approved/published.
        Comparison source bytes are not silently truncated.
  /api/v1/private/projects/{project_id}/repository/merge-requests:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    get:
      tags:
      - Repository
      summary: List pinned merge review rounds.
      operationId: listRepositoryMergeRequests
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryMergeRequestListEnvelope"
    post:
      tags:
      - Repository
      summary: Create a three-way merge review of fixed branch heads.
      operationId: createRepositoryMergeRequest
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryMergeRequestEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositoryMergeInput"
      description: Records source/target IDs, generations, a proven lowest common ancestor
        and the exact result_files candidate. Supports disjoint line edits within one
        file and independent metadata changes. Conflicts contain document IDs, plus
        path-conflict for colliding result paths. Criss-cross histories with multiple
        lowest common ancestors fail explicitly rather than inventing a base.
  /api/v1/private/projects/{project_id}/repository/merge-requests/{request_id}/documents/{document_id}/content:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: request_id
      in: path
      required: true
      schema:
        type: string
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Repository
      summary: Read the exact pinned result candidate before review.
      operationId: getRepositoryMergeCandidateContent
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryMergeContentEnvelope"
      description: Returns content from result_files, which can differ from both input
        commits after automatic three-way merging. Content never comes from an arbitrary
        client object key. A stale review round stays readable, but approval and merge
        fail REVIEW_STALE until a new round is created.
  /api/v1/private/projects/{project_id}/repository/merge-requests/{request_id}/resolve:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: request_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository
      summary: Save a complete conflict resolution as a new commit and review round.
      operationId: resolveRepositoryMergeRequest
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryMergeRequestEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositoryResolveInput"
      description: 'Writer only; source branch must be unprotected. All expected review/head/generation
        values are required. files is the COMPLETE desired tree: every item is an upsert
        with a document_id; omit a document to delete it, and send [] to remove all
        files. Produces a two-parent immutable resolution commit on the source branch,
        marks the old review superseded and returns a NEW review ID. Human administration
        approval of the new round is still required. Idempotent retries return the same
        new review.'
  /api/v1/private/projects/{project_id}/repository/merge-requests/{request_id}/approve:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: request_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository
      summary: Approve exactly the pinned current result candidate.
      operationId: approveRepositoryMergeRequest
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryMergeRequestEnvelope"
      description: Project administrator review. Conflicts, invalid OpenAPI, closed
        rounds or moved source/target HEAD/generation are refused. An empty JSON body
        is accepted. Approval does not publish a release.
  /api/v1/private/projects/{project_id}/repository/merge-requests/{request_id}/merge:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: request_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository
      summary: Merge the currently approved pinned review.
      operationId: mergeRepositoryMergeRequest
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryCommitEnvelope"
      description: Project administrator only. Rechecks both HEADs and generations,
        refusing stale approvals with REVIEW_STALE. Fast-forwards where the target is
        the base; otherwise creates a server-generated commit with target+source parents.
        Original snapshots remain immutable.
  /api/v1/private/projects/{project_id}/repository/branches/{branch_id}/reverts:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: branch_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository
      summary: Revert a commit through a new inverse-change commit.
      operationId: revertRepositoryCommit
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryCommitEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositoryRevertInput"
      description: Writer only on unprotected working branches. Parent index selects
        the mainline parent for a merge commit. Preserves unrelated later edits, refuses
        overlapping inverse changes with REVERT_CONFLICT and supports idempotent retries.
        History is never reset or deleted.
  /api/v1/private/projects/{project_id}/repository/releases:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    get:
      tags:
      - Repository
      summary: List immutable publication references.
      operationId: listRepositoryReleases
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryReleaseListEnvelope"
    post:
      tags:
      - Repository
      summary: Publish a fixed commit with a server-generated version name.
      operationId: publishRepositoryRelease
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryReleaseEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositoryPublishInput"
      description: Human project administrator only; MCP cannot publish. commit_id must
        still equal the supplied branch HEAD and expected_generation must match. The
        server creates release ID and version_name; client version_name is rejected.
        Validates all OpenAPI files. Release content remains fixed after the branch
        moves.
  /api/v1/private/projects/{project_id}/repository/events:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    get:
      tags:
      - Repository
      summary: Read the append-only project event ledger.
      operationId: listRepositoryEvents
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryEventListEnvelope"
      description: Use exclusive after_sequence and the last returned sequence to continue
        (at most 100 events per request). Identity is generated by the server. Events
        include commit.created, branch.created/updated, merge_request.created/approved/resolved/merged
        and release.published.
      parameters:
      - name: after_sequence
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
  /api/v1/private/projects/{project_id}/repository/releases/{release_id}/documents/{document_id}/shares:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: release_id
      in: path
      required: true
      schema:
        type: string
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Repository
      summary: List capabilities bound to a fixed release document.
      operationId: listRepositoryReleaseShares
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryShareListEnvelope"
      description: Human project administrators only. Responses never contain capability
        secrets.
    post:
      tags:
      - Repository
      summary: Create a fixed-release public document capability.
      operationId: createRepositoryReleaseShare
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryShareSecretEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepositoryShareInput"
      description: Human project administrators only. Password length is 12–72 UTF-8
        bytes when present. Returns a secret only in create/reveal responses. The public
        document-shares route accepts this new release capability and exposes its fixed
        release ID as version_id; it never follows branch HEAD.
  /api/v1/private/projects/{project_id}/repository/releases/{release_id}/documents/{document_id}/shares/{share_id}/reveal:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: release_id
      in: path
      required: true
      schema:
        type: string
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    - name: share_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository
      summary: Reveal an active fixed-release capability secret.
      operationId: revealRepositoryReleaseShare
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryShareSecretEnvelope"
      description: Human project administrators only; secrets stay out of list responses
        and audit metadata.
  /api/v1/private/projects/{project_id}/repository/releases/{release_id}/documents/{document_id}/shares/{share_id}/revoke:
    parameters:
    - "$ref": "#/components/parameters/ProjectID"
    - name: release_id
      in: path
      required: true
      schema:
        type: string
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    - name: share_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Repository
      summary: Revoke a fixed-release capability.
      operationId: revokeRepositoryReleaseShare
      security:
      - JWTAuth: []
      responses:
        '200':
          description: HTTP 200 Vdoc envelope; semantic errors are body.code/status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepositoryShareEnvelope"
      description: Human project administrators only. Existing public capability/proofs
        stop working; the release remains immutable.
components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw JWT string issued by login or register.
    MCPTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw MCP token string issued by the private MCP token APIs.
    DocumentShareAuth:
      type: apiKey
      in: header
      name: Authorization
      description: VdocShare scheme carrying the fragment-derived document-share capability. Protected links also require X-Vdoc-Share-Unlock after password exchange.
  parameters:
    PageSizeQuery:
      name: page_size
      in: query
      description: Opt in to server pagination. Omit for the legacy full-list response.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    OffsetQuery:
      name: offset
      in: query
      description: Number of matching rows to skip; requires page_size.
      schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    SearchQuery:
      name: search
      in: query
      description: Case-insensitive literal search; requires page_size. Maximum 256 UTF-8 bytes.
      schema: { type: string, maxLength: 256 }
    BranchIDQuery:
      name: branch_id
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: Filter drafts or versions to one document branch.
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string }
      description: Project ID.
    DocumentID:
      name: document_id
      in: path
      required: true
      schema: { type: string }
      description: Document ID.
    BranchID:
      name: branch_id
      in: path
      required: true
      schema: { type: string }
      description: Branch ID.
    DraftID:
      name: draft_id
      in: path
      required: true
      schema: { type: string }
      description: Draft ID.
    VersionID:
      name: version_id
      in: path
      required: true
      schema: { type: string }
      description: Published document version ID.
    ShareID:
      name: share_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
      description: Public document share ID. The capability secret is never placed in this path.
    EndpointID:
      name: endpoint_id
      in: path
      required: true
      schema: { type: string }
      description: Parsed endpoint ID.
    DiffID:
      name: diff_id
      in: path
      required: true
      schema: { type: string }
      description: Diff ID.
    TokenID:
      name: token_id
      in: path
      required: true
      schema: { type: string }
      description: MCP token ID.
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string }
      description: User ID.
    TeamID:
      name: team_id
      in: path
      required: true
      schema: { type: string }
      description: Team ID.
    ContentKind:
      name: content_kind
      in: path
      required: true
      schema:
        type: string
        enum: [raw, normalized, stable]
      description: Selects raw, normalized OpenAPI, or stable Markdown/TXT content.
    AIPromptKey:
      name: prompt_key
      in: path
      required: true
      schema:
        type: string
        enum:
          [
            draft_review_summary,
            version_change_summary,
            diff_change_summary,
            page_chat,
          ]
      description: AI prompt key.
    AIChatSessionID:
      name: session_id
      in: path
      required: true
      schema: { type: string }
      description: AI chat session ID.
    AIChatDocumentIDQuery:
      name: document_id
      in: query
      required: true
      schema: { type: string }
      description: Document ID for the exact AI page context.
    AIChatContextTypeQuery:
      name: context_type
      in: query
      required: true
      schema:
        type: string
        enum: [draft, version, diff, document]
      description: AI chat context type; document searches authorized branches, published versions and saved drafts.
    AIChatContextIDQuery:
      name: context_id
      in: query
      required: true
      schema: { type: string }
      description: Draft, version, Diff, or Document ID; document context requires context_id equal to document_id.
  responses:
    AIChatMessageResponse:
      description: A JSON envelope or negotiated SSE chat response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VdocEnvelope" }
        text/event-stream:
          schema:
            type: string
            description: SSE delta events with JSON delta strings, then a done or error event containing the standard envelope. Only done confirms persistence.
    VdocEnvelopeResponse:
      description: HTTP 200 response with Vdoc envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VdocEnvelope" }
    VdocListEnvelopeResponse:
      description: HTTP 200 response with Vdoc envelope and total count.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VdocListEnvelope" }
    OpenAPISpecResponse:
      description: Checked-in OpenAPI YAML bytes.
      content:
        application/yaml:
          schema: { type: string }
    MCPJSONRPCResponse:
      description: HTTP 200 response containing a JSON-RPC success or error object.
      content:
        application/json:
          schema: { type: object }
    PublicDocumentDownloadResponse:
      description: Authorized immutable raw OpenAPI, Markdown, or TXT bytes with an attachment Content-Disposition header.
      headers:
        Content-Disposition:
          schema: { type: string }
      content:
        application/json:
          schema: { type: string, format: binary }
        application/yaml:
          schema: { type: string, format: binary }
        text/markdown:
          schema: { type: string, format: binary }
        text/plain:
          schema: { type: string, format: binary }
  schemas:
    SystemVersion:
      type: object
      additionalProperties: false
      required: [version, git_commit, build_time, channel]
      properties:
        version: { type: string, example: v0.3.17-beta.4 }
        git_commit: { type: string, example: abc1234 }
        build_time: { type: string, example: "2026-10-23_10:00:00" }
        channel: { type: string, enum: [beta, release, development] }
    SystemUpdates:
      type: object
      additionalProperties: false
      required: [current_version, channel, latest_version, update_available, release_url, published_at]
      properties:
        current_version: { type: string, example: v0.3.17-beta.4 }
        channel: { type: string, enum: [beta, release] }
        latest_version: { type: [string, "null"], example: v0.3.17-beta.5 }
        update_available: { type: boolean }
        release_url: { type: [string, "null"], example: "https://github.com/ChnMig/Vdoc-site/releases/tag/v0.3.17-beta.5" }
        published_at: { type: [string, "null"], format: date-time }
    VdocEnvelope:
      type: object
      properties:
        code: { type: integer }
        status: { type: string }
        description: { type: string }
        message: { type: string }
        trace_id: { type: string }
        timestamp: { type: integer }
        detail: {}
    VdocListEnvelope:
      allOf:
        - { $ref: "#/components/schemas/VdocEnvelope" }
        - type: object
          properties:
            total: { type: integer, description: Total matches for offset pagination; omitted for audit cursor pages. }
            has_more: { type: boolean }
            next_cursor: { type: string, description: Present when another cursor page is available. }
    AuthRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password:
          type: string
          format: password
          description: UTF-8 encoding must be 12 to 72 bytes with no leading or trailing whitespace.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: The signed-in user's current password; never returned or logged.
        new_password:
          type: string
          format: password
          writeOnly: true
          description: UTF-8 encoding must be 12 to 72 bytes, with no leading or trailing whitespace, and differ from the current password.
    MCPCallRequest:
      type: object
      description: JSON-RPC 2.0 tools/list or tools/call request, or the documented legacy tool bridge object.
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id: {}
        method: { type: string, enum: [tools/list, tools/call] }
        params: { type: object }
        tool: { $ref: "#/components/schemas/MCPToolName" }
        arguments: { type: object }
    DocumentShareUnlockRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, name, password, is_super_admin]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password:
          type: string
          format: password
          description: UTF-8 encoding must be 12 to 72 bytes with no leading or trailing whitespace.
        is_super_admin: { type: boolean }
    PatchUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: integer, enum: [1, 2] }
        is_super_admin: { type: boolean }
    NameDescriptionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    PatchNameDescriptionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [team_id, name]
      properties:
        team_id: { type: string }
        name: { type: string, minLength: 1 }
        description: { type: string }
        admin_user_id:
          type: string
          description: Optional active user to assign as initial Project Admin; omitted or blank selects the acting SuperAdmin.
    AddProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: { type: string }
        role: { type: integer, enum: [1, 2, 3] }
    PatchProjectMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: integer, enum: [1, 2, 3] }
    DocumentRequest:
      type: object
      additionalProperties: false
      required: [name]
      allOf:
        - not: { required: [relative_path, file_name] }
        - not: { required: [relative_path, folder_id] }
        - if: { required: [folder_id] }
          then: { required: [file_name] }
      properties:
        name: { type: string, minLength: 1 }
        document_type: { type: integer, enum: [1, 2, 3], default: 1 }
        relative_path:
          type: [string, "null"]
          description: Legacy project-local path. Cannot be combined with file_name or folder_id, including when this field is empty or null. Missing parent folders are created without rewriting the supplied path.
        file_name:
          type: string
          minLength: 1
          description: Independent filename, as one safe path segment. A missing suffix defaults to .yaml for OpenAPI, .md for Markdown, or .txt for TXT. OpenAPI permits .yaml, .yml, and .json. It need not match name.
        folder_id:
          type: [string, "null"]
          description: Folder in this project. Omitted, null, or empty selects the project root. Requires file_name.
        description: { type: string }
        initial_content: { $ref: "#/components/schemas/InitialDocumentContent" }
    PatchDocumentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      allOf:
        - not: { required: [relative_path, file_name] }
        - not: { required: [relative_path, folder_id] }
      properties:
        name: { type: string, minLength: 1 }
        relative_path: { type: string, minLength: 1 }
        file_name:
          type: string
          minLength: 1
          description: Replaces only the filename, preserving the selected folder unless folder_id is also supplied. Uses the document type's suffix validation.
        folder_id:
          type: [string, "null"]
          description: Omitted retains the current folder. Null or empty moves to the project root; otherwise the folder must belong to this project. Does not alter historical paths.
        description: { type: string }
    InitialDocumentContent:
      type: object
      additionalProperties: false
      required: [content]
      description: Optional initial source content. The first draft and document are committed atomically. TXT permits an empty string; Markdown and OpenAPI retain their normal content validation. No review submission or publication occurs.
      properties:
        content: { type: string }

openapi: 3.1.0
info:
  title: Vdoc API
  version: 0.1.0
  description: Machine-readable contract for the Vdoc v0.1 HTTP API. Projects own typed Documents, including OpenAPI, Markdown, and TXT. REST handlers return HTTP 200 with the semantic result in the Vdoc envelope body.
servers:
  - url: /
security: []
tags:
  - name: Open
    description: Public health, authentication, docs, and MCP entry points.
  - name: Document Shares
    description: Admin-managed document share links and minimal anonymous published-content access.
  - name: Identity
    description: Current user identity.
  - name: System
    description: Deployed backend build and read-only release update checks for all active signed-in users.
  - name: System Users
    description: Super admin user lifecycle and user MCP token oversight.
  - name: Teams
    description: Team lifecycle.
  - name: Projects
    description: Project lifecycle and membership.
  - name: Documents
    description: Project document lifecycle.
  - name: Document Folders
    description: Persistent project-local folders with arbitrary nesting.
  - name: Branches
    description: Document branch lifecycle.
  - name: Drafts
    description: Document draft creation, update, review, and promotion.
  - name: Versions
    description: Published document versions and stored content.
  - name: Endpoints
    description: Parsed endpoint data from published document versions.
  - name: Diffs
    description: Document version comparison.
  - name: Audit Logs
    description: Filtered audit history for super administrators and project administrators.
  - name: MCP Tokens
    description: User MCP token lifecycle.
  - name: AI
    description: Built-in Admin AI provider, prompt, summary, and page chat APIs. AI can summarize and explain only; it cannot approve, request changes, reject, publish, or modify drafts or versions. Draft submit and version publish attempt summaries after the state change is saved. Skipped or failed summaries are stored without blocking submit or publish. AI audit metadata may include prompt_tokens, completion_tokens, and total_tokens, but never raw API keys, JWTs, MCP tokens, or Authorization headers.
  - name: Repository Automation
    description: Immutable commit AI analysis and reliable event subscriptions.
  - name: Repository
    description: Project branches, immutable commits, pinned human reviews and server-generated releases.
paths:
  /api/v1/open/health:
    get:
      tags: [Open]
      summary: Get health.
      operationId: getOpenHealth
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/open/auth/register:
    post:
      tags: [Open]
      summary: Register a user and issue a JWT when anonymous registration is enabled.
      description: Disabled by default. Operators must explicitly set auth.allow_registration=true only for trusted disposable or pilot environments.
      operationId: registerAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/open/auth/login:
    post:
      tags: [Open]
      summary: Authenticate a user and issue a JWT.
      operationId: loginAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/open/auth/config:
    get:
      tags: [Open]
      summary: Read public authentication capabilities.
      description: Returns whether anonymous registration is enabled so clients can hide unavailable registration flows.
      operationId: getAuthConfig
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/open/docs/openapi.yaml:
    get:
      tags: [Open]
      summary: Serve this OpenAPI YAML document.
      operationId: getOpenAPISpec
      responses:
        "200": { $ref: "#/components/responses/OpenAPISpecResponse" }
  /api/v1/open/mcp:
    post:
      tags: [Open]
      summary: Call MCP tools through JSON-RPC 2.0.
      description: Every authenticated `tools/list` and `tools/call` request records a sanitized `mcp.tool_call` audit event. Successful published-content tools are marked with `evidence_kind=published_content_read` and retain only the tool, adapter, result/reason, MCP token ID, and referenced project/document/branch/draft/version/endpoint/diff IDs. Raw MCP token secrets, request arguments, OpenAPI schemas, and Markdown content are never copied into audit metadata.
      operationId: callMCP
      security:
        - MCPTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPCallRequest" }
      responses:
        "200": { $ref: "#/components/responses/MCPJSONRPCResponse" }
  /api/v1/open/document-shares/{share_id}:
    parameters:
      - { $ref: "#/components/parameters/ShareID" }
    get:
      tags: [Document Shares]
      summary: Read minimal metadata for an authorized public document share.
      description: current_version follows the branch for scopes 1 and 2; for fixed-version scope 3 it always identifies the pinned published version.
      operationId: getPublicDocumentShare
      security: [{ DocumentShareAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/open/document-shares/{share_id}/unlock:
    parameters:
      - { $ref: "#/components/parameters/ShareID" }
    post:
      tags: [Document Shares]
      summary: Exchange a valid share password for a short-lived memory-only unlock proof.
      operationId: unlockPublicDocumentShare
      security: [{ DocumentShareAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentShareUnlockRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/open/document-shares/{share_id}/versions:
    parameters:
      - { $ref: "#/components/parameters/ShareID" }
    get:
      tags: [Document Shares]
      summary: List published versions allowed by an all-versions share.
      description: Available only for scope 2. Latest-only and fixed-version shares return the same unavailable response as an unauthorized request.
      operationId: listPublicDocumentShareVersions
      security: [{ DocumentShareAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
  /api/v1/open/document-shares/{share_id}/versions/{version_id}/content:
    parameters:
      - { $ref: "#/components/parameters/ShareID" }
      - { $ref: "#/components/parameters/VersionID" }
    get:
      tags: [Document Shares]
      summary: Read an allowed immutable published snapshot.
      description: A fixed-version share allows only its pinned version_id. Other version IDs return the same public unavailable response.
      operationId: getPublicDocumentShareContent
      security: [{ DocumentShareAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/open/document-shares/{share_id}/versions/{version_id}/download:
    parameters:
      - { $ref: "#/components/parameters/ShareID" }
      - { $ref: "#/components/parameters/VersionID" }
    get:
      tags: [Document Shares]
      summary: Download an allowed immutable published source file through Vdoc authorization.
      description: A fixed-version share allows only its pinned version_id. Other version IDs return the same public unavailable response.
      operationId: downloadPublicDocumentShareVersion
      security: [{ DocumentShareAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/PublicDocumentDownloadResponse" }
  /api/v1/private/identity/me:
    get:
      tags: [Identity]
      summary: Get current user.
      description: Returns the active identity plus can_access_audit, a server-computed capability used by clients without enumerating project memberships.
      operationId: getIdentityMe
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/identity/me/password:
    post:
      tags: [Identity]
      summary: Change the signed-in user's own password.
      description: >-
        Verifies current_password and changes only the active JWT user's password.
        Both ordinary users and SuperAdmins may use this endpoint; the authenticated identity
        always determines the target account, regardless of any user ID in the request.
        The new password must differ from the current one and satisfy the account password policy.
        Incorrect current passwords and invalid new passwords return INVALID_ARGUMENT without
        invalidating the session; concurrent credential updates return FAILED_PRECONDITION.
        Independently rate-limited per IP using auth.rate_limit and auth.rate_burst.
        Clients should clear their current session and sign in again after success.
        Existing JWTs retain their configured expiration and MCP tokens are unchanged.
      operationId: changeIdentityPassword
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/system/version:
    get:
      tags: [System]
      summary: Read the deployed backend build version.
      description: >-
        Available to every active signed-in user. The detail object follows SystemVersion;
        version, git_commit and build_time are injected into the running backend binary at build time.
        Strict vX.Y.Z-beta.N tags use beta, strict vX.Y.Z tags use release, and all other builds use development.
        This endpoint does not contact the update service.
      operationId: getSystemVersion
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/system/updates:
    get:
      tags: [System]
      summary: Manually check for a newer release in this deployment's channel.
      description: >-
        Available to every active signed-in user. The detail object follows SystemUpdates.
        Reads only https://api.github.com/repos/ChnMig/Vdoc-site/releases; never installs, restarts or downloads an update.
        Beta deployments consider only non-draft prereleases named vX.Y.Z-beta.N; stable deployments consider only
        non-draft non-prereleases named vX.Y.Z. Numeric version ordering is used, including beta.10 after beta.9.
        Successful checks are cached per channel for two minutes. No matching release returns update_available=false
        and null latest_version, release_url and published_at. Development builds return FAILED_PRECONDITION.
        Upstream/network/invalid-response errors return UNAVAILABLE, deadlines return DEADLINE_EXCEEDED,
        and cancellation returns CANCELLED; failures are never reported as an up-to-date deployment.
      operationId: checkSystemUpdates
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/system/users:
    get:
      tags: [System Users]
      summary: List users.
      operationId: listSystemUsers
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [System Users]
      summary: Create user.
      operationId: createSystemUser
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/system/users/{user_id}:
    parameters:
      - { $ref: "#/components/parameters/UserID" }
    patch:
      tags: [System Users]
      summary: Patch user.
      operationId: patchSystemUser
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchUserRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/system/users/{user_id}/mcp-tokens:
    parameters:
      - { $ref: "#/components/parameters/UserID" }
    get:
      tags: [System Users]
      summary: List a user's MCP tokens.
      operationId: listSystemUserMCPTokens
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
  /api/v1/private/system/users/{user_id}/mcp-tokens/{token_id}/revoke:
    parameters:
      - { $ref: "#/components/parameters/UserID" }
      - { $ref: "#/components/parameters/TokenID" }
    post:
      tags: [System Users]
      summary: Revoke a user's MCP token.
      operationId: revokeSystemUserMCPToken
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/teams:
    get:
      tags: [Teams]
      summary: List teams (SuperAdmin only).
      operationId: listTeams
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [Teams]
      summary: Create team.
      operationId: createTeam
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameDescriptionRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/teams/{team_id}:
    parameters:
      - { $ref: "#/components/parameters/TeamID" }
    get:
      tags: [Teams]
      summary: Get team (SuperAdmin only).
      operationId: getTeam
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
    patch:
      tags: [Teams]
      summary: Update team.
      operationId: updateTeam
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchNameDescriptionRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/teams/{team_id}/archive:
    parameters:
      - { $ref: "#/components/parameters/TeamID" }
    post:
      tags: [Teams]
      summary: Archive team.
      operationId: archiveTeam
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects:
    get:
      tags: [Projects]
      summary: List projects.
      description: Returns accessible ProjectDTO records with team_name for team and project navigation; this does not grant access to the SuperAdmin-only Teams API.
      operationId: listProjects
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [Projects]
      summary: Create project.
      operationId: createProject
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      tags: [Projects]
      summary: Get project.
      operationId: getProject
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
    patch:
      tags: [Projects]
      summary: Update project.
      operationId: updateProject
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchNameDescriptionRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/archive:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    post:
      tags: [Projects]
      summary: Archive project.
      operationId: archiveProject
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/members:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      tags: [Projects]
      summary: List project members.
      operationId: listProjectMembers
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [Projects]
      summary: Add project member.
      operationId: addProjectMember
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectMemberRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/member-candidates:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      tags: [Projects]
      summary: List active users eligible to join the project.
      description: Project Admin or SuperAdmin only. Existing active project members and disabled users are excluded.
      operationId: listProjectMemberCandidates
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/members/{user_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/UserID" }
    delete:
      tags: [Projects]
      summary: Remove project member.
      operationId: removeProjectMember
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/members/{user_id}/role:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/UserID" }
    patch:
      tags: [Projects]
      summary: Change project member role.
      operationId: patchProjectMemberRole
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/PatchProjectMemberRoleRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/documents:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      tags: [Documents]
      summary: List project documents.
      description: Returns DocumentDTO records including folder_id, file_name, workflow_state, has_draft, and available latest version/draft IDs. The lifecycle status remains separate from the published/draft/empty workflow state.
      operationId: listProjectDocuments
      security: [{ JWTAuth: [] }]
      parameters:
        - name: document_type
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: Filter documents by type code (1 OpenAPI, 2 Markdown, 3 TXT).
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [Documents]
      summary: Create project document.
      description: Creates a typed Document. document_type 1 is OpenAPI and 2 is Markdown; 3 is TXT. relative_path is the stored project-local path identity. Prefer independent name, file_name, and nullable folder_id; the server derives relative_path. Optional initial_content creates an editable draft on dev atomically with the document and default branches. It does not submit or publish. The flat DocumentDTO response also includes initial_draft_id and initial_branch_id when initial content is supplied. Validation or persistence failure leaves no newly created document, branches, folders, or draft.
      operationId: createProjectDocument
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/folders:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      tags: [Document Folders]
      summary: List project folders.
      description: Requires project read permission. Returns a flat FolderDTO array in detail with total; parent_id is null for folders under the virtual project root. Empty folders are retained, and nesting has no fixed depth limit.
      operationId: listProjectFolders
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [Document Folders]
      summary: Create project folder.
      description: Project Admin or SuperAdmin only, and the project must be active. Returns FolderDTO. The parent must belong to the same project; omitted or null parent_id selects the virtual project root. Sibling names are unique without regard to case. Folder names are single safe path segments, excluding dot segments and control characters.
      operationId: createProjectFolder
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFolderRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/documents/{document_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/DocumentID" }
    get:
      tags: [Documents]
      summary: Get project document.
      operationId: getProjectDocument
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
    patch:
      tags: [Documents]
      summary: Update project document.
      description: Updates document metadata only. name is independent from file_name. Omitted folder_id retains the folder; null or an empty string moves to the project root. Omitted file_name retains the current filename. The server derives relative_path; legacy relative_path cannot be combined with file_name or folder_id. Moving or renaming a document does not rewrite historical draft or version paths. Lifecycle status cannot be changed here; use the archive action. Invalid lifecycle input is rejected before any metadata is committed.
      operationId: updateProjectDocument
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchDocumentRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/documents/{document_id}/overview:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/DocumentID" }
    get:
      tags: [Documents]
      summary: Read document statistics without downloading bodies or full lists.
      description: "Detail contains version_count, endpoint_count, latest_version (public version DTO or null), published_branch_ids (active published branches), has_reviewed_draft (submitted or published draft on an active branch), raw_size_bytes and nullable raw_line_count. Requires document read permission."
      operationId: getDocumentOverview
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/documents/{document_id}/activity:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/DocumentID" }
    get:
      tags: [Documents]
      summary: Read the document workflow timeline.
      description: "Requires document read permission. Returns newest first by created_at and id, with an opaque next_cursor and a maximum limit of 200 (default 50). Each item contains id, action, resource_id, optional branch_id/branch_name/version_name/review_action and created_at. Only document, branch, draft and publication lifecycle events are included. Audit metadata, review comments, IP addresses, tokens and client information are not exposed. This endpoint is private and unavailable to public-share capabilities."
      operationId: listDocumentActivity
      security: [{ JWTAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/documents/{document_id}/mcp-readiness:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/DocumentID" }
    get:
      tags: [Documents]
      summary: Read the latest successful Agent document read across all history.
      description: "Detail contains nullable last_read_at. Only the current user's active unexpired tokens with the document's matching read scope count. Requires document read permission; archived parents return null."
      operationId: getDocumentMCPReadiness
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/documents/{document_id}/archive:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/DocumentID" }
    post:
      tags: [Documents]
      summary: Archive project document.
      operationId: archiveProjectDocument
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/documents/{document_id}/shares:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/DocumentID" }
    get:
      tags: [Document Shares]
      summary: List retained public-share history for a document.
      operationId: listDocumentShares
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [Document Shares]
      summary: Create an immutable branch-bound public-share policy and return its capability once.
      description: Requires an active Project, Document, and Branch with at least one published version. Scope 3 additionally requires version_id for a published version belonging to the same document and branch; scopes 1 and 2 omit version_id. Fixed-version share responses include version_id and never follow newer publications. Archived parents retain list and revoke access but block creation.
      operationId: createDocumentShare
      security: [{ JWTAuth: [] }]
      requestBody:

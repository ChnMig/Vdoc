    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: One safe folder-name segment after trimming, excluding dot segments, separators, and control characters.
        parent_id:
          type: [string, "null"]
          description: Parent folder in this project; omitted, null, or empty selects the virtual project root.
    FolderDTO:
      type: object
      additionalProperties: false
      required: [id, project_id, parent_id, name, path, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        parent_id: { type: [string, "null"] }
        name: { type: string }
        path: { type: string, description: Canonical project-local folder path without a leading or trailing slash. }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentDTO:
      type: object
      additionalProperties: false
      required: [id, project_id, name, document_type, folder_id, file_name, workflow_state, has_draft, status, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string, description: Display name, independent of the stored filename. }
        document_type: { type: integer, enum: [1, 2, 3] }
        relative_path: { type: string }
        folder_id: { type: [string, "null"], description: Null represents the virtual project root. }
        file_name: { type: string, description: Filename derived from relative_path. }
        workflow_state: { type: string, enum: [published, draft, empty], description: Published when a published version exists; otherwise draft when an unpublished draft exists; otherwise empty. Separate from lifecycle status. }
        has_draft: { type: boolean, description: Whether an unpublished draft exists, including when workflow_state is published. }
        latest_version_id: { type: string, description: Omitted when no accessible published version exists. }
        latest_draft_id: { type: string, description: Omitted when no accessible unpublished draft exists. This metadata exposes no content. }
        description: { type: string }
        status: { type: integer, enum: [1, 2], description: Document lifecycle status; not a publication indicator. }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        initial_draft_id: { type: string, description: Present only in the create response when initial_content was supplied. }
        initial_branch_id: { type: string, description: Present only in the create response when initial_content was supplied; identifies the dev branch. }
    ProjectDTO:
      type: object
      additionalProperties: false
      required: [id, team_id, name, status, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        team_id: { type: string }
        team_name: { type: string, description: Name of the owning team, enriched only for an accessible project. This does not broaden Teams API permissions. }
        name: { type: string }
        description: { type: string }
        status: { type: integer, enum: [1, 2] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDocumentShareRequest:
      type: object
      additionalProperties: false
      required: [branch_id, version_scope, expiry_preset]
      properties:
        branch_id: { type: string }
        version_scope: { type: integer, enum: [1, 2, 3], description: "1 follows latest, 2 allows all published versions, 3 fixes one published version." }
        version_id: { type: string, minLength: 1, description: Required only for scope 3; must belong to the selected project/document/branch and be published. Omit for scopes 1 and 2. }
        expiry_preset:
          type: string
          enum: [1_month, 3_months, 6_months, 1_year, permanent]
        password: { type: string }
    CreateBranchRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed custom branch name, for example main, release, feature/checkout or release/2026. The exact names dev, test and prod use environment kind; other valid names use feature kind. Backslashes, control characters, empty slash-separated segments and dot or dot-dot segments are rejected. Names are case-sensitive and unique per document, including archived branches.
        description: { type: string }
    PatchBranchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed custom branch name, for example main, release, feature/checkout or release/2026. The exact names dev, test and prod use environment kind; other valid names use feature kind. Backslashes, control characters, empty slash-separated segments and dot or dot-dot segments are rejected. Names are case-sensitive and unique per document, including archived branches.
        description: { type: string }
        is_default: { type: boolean }
        is_protected: { type: boolean }
    DraftRequest:
      type: object
      additionalProperties: false
      required: [branch_id, version_name]

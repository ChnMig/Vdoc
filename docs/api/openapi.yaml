    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    post:
      tags: [AI]
      summary: Test the effective project AI provider.
      description: Project Admin or SuperAdmin only, and the project must be active. With no request body, tests the effective provider and falls back to the enabled system provider when no enabled project override exists. A request body supplies AIProviderRequest for a one-off project-scoped test. Reader and Writer are denied this configuration operation but may use page summaries and chat where document permissions allow.
      operationId: testProjectAIProvider
      security: [{ JWTAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProviderRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/provider/models:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    post:
      tags: [AI]
      summary: Discover models for the current project provider connection.
      description: Project Admin or SuperAdmin only, and the project must be active. Same request and detail.models result as system model discovery. With no body, uses the saved project provider, or the enabled system provider when no project provider exists. A supplied API key and URL are used only for this call; the stored project key is reused only for an unchanged normalized URL. Reader and Writer are denied. Raw credentials and upstream response bodies are never returned.
      operationId: listProjectAIProviderModels
      security: [{ JWTAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProviderModelsRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/ai/provider/key/reveal:

    post:
      tags: [AI]
      summary: Explicitly reveal the saved AI provider API key.
      description: Project Admin or SuperAdmin only; active project. Reveals only the project override, never the system fallback key. Records a secret-free audit before returning detail.api_key. Responses use Cache-Control no-store; ordinary provider DTOs remain redacted.
      operationId: revealProjectAIProviderKey
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }

      operationId: getDocumentDiffSummary
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/audit-logs:
    get:
      tags: [Audit Logs]
      summary: List authorized audit history.
      description: Super administrators may query all projects. Project administrators must supply project_id and can query only projects they administer. Reader and writer roles are denied. Results are newest first with at most 200 rows per page. Follow next_cursor to continue; has_more indicates whether a next page exists. A global total is omitted. Optional actor matches a case-insensitive email substring or exact user ID before pagination. DTOs add actor_email and project_name when available; original IDs remain unchanged.
      operationId: listAuditLogs
      security: [{ JWTAuth: [] }]
      parameters:
        - {
            name: project_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - { name: actor, in: query, required: false, schema: { type: string, maxLength: 256 }, description: Email substring or exact user ID. }
        - { name: action, in: query, required: false, schema: { type: string } }
        - {
            name: resource_type,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: resource_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200, default: 100 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 }, description: Opaque next_cursor from the preceding page. Filters and authorization apply on every request. }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Inclusive lower time bound. }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Exclusive upper time bound. }
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
  /api/v1/private/ai/provider:
    get:
      tags: [AI]
      summary: Get system AI provider configuration.
      description: SuperAdmin only. Returns provider detail using AIProviderResponse. The response includes tuning fields temperature, timeout_ms, and max_output_tokens, plus redacted key state through api_key_set and api_key_last4.
      operationId: getSystemAIProvider
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
    put:
      tags: [AI]
      summary: Upsert system AI provider configuration.
      description: SuperAdmin only. Saves an OpenAI-compatible provider. Omitted tuning fields use defaults from AIProviderRequest. This save response never returns the raw api_key; an explicit audited reveal endpoint is separate.
      operationId: putSystemAIProvider
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProviderRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/ai/provider/test:
    post:
      tags: [AI]
      summary: Test the system AI provider without exposing its API key.
      description: SuperAdmin only. Tests the saved provider when the body is omitted, or tests the supplied AIProviderRequest without exposing the API key. Audit metadata records token usage when the provider returns usage fields and excludes secrets.
      operationId: testSystemAIProvider
      security: [{ JWTAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProviderRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/ai/provider/models:
    post:
      tags: [AI]
      summary: Discover models using the system provider credentials.
      description: SuperAdmin only. Returns detail.models as a sorted unique array of model IDs from the OpenAI-compatible GET /v1/models endpoint, without inference or configuration writes. Omit the body to use the saved provider, including a disabled provider. A supplied body needs no model name; omitting api_key reuses the stored key only when the normalized base_url is unchanged. Responses are bounded to 4 MiB and 4096 entries. Redirects and unsafe network destinations are rejected. Discovery failure does not prohibit saving a manually entered model ID.
      operationId: listSystemAIProviderModels
      security: [{ JWTAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProviderModelsRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/provider:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      tags: [AI]
      summary: Get project AI provider configuration.
      description: Project Admin or SuperAdmin only; Reader and Writer are denied even though they may use page summaries and chat where document permissions allow. Returns the project override using AIProviderResponse when configured. Historical configuration remains readable after project archive. Provider response fields include tuning values and redacted key metadata only.
      operationId: getProjectAIProvider
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
    put:
      tags: [AI]
      summary: Upsert project AI provider configuration.
      description: Project Admin or SuperAdmin only. Saves a project-level provider override for an active project with the same AIProviderRequest tuning defaults and ranges as the system provider. Archived project configuration cannot be changed.
      operationId: putProjectAIProvider
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProviderRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }

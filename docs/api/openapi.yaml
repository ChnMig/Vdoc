  /api/v1/private/projects/{project_id}/ai/chat-sessions:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      tags: [AI]
      summary: List AI chat sessions for an exact draft, version, or diff context.
      description: Returns retained sessions newest-updated first, including after the Project, Document, or target Branch is archived.
      operationId: listAIChatSessions
      security: [{ JWTAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AIChatDocumentIDQuery" }
        - { $ref: "#/components/parameters/AIChatContextTypeQuery" }
        - { $ref: "#/components/parameters/AIChatContextIDQuery" }
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [AI]
      summary: Create an AI chat session scoped to a draft, version, or diff.
      description: Requires an active Project, Document, and target Branch. Existing sessions remain readable after archive.
      operationId: createAIChatSession
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIChatSessionRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/chat-sessions/{session_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/AIChatSessionID" }
    get:
      tags: [AI]
      summary: Get an AI chat session and messages.
      operationId: getAIChatSession
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/chat-sessions/{session_id}/messages:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/AIChatSessionID" }
    post:
      tags: [AI]
      summary: Send a message in a page-scoped AI chat session.
      operationId: sendAIChatMessage
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIChatMessageRequest" }

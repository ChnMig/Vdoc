        enabled: { type: boolean }
        stream:
          type: boolean
          default: true
          description: Effective upstream streaming mode. Historical and unset configurations default to true.
        temperature:
          type: number
          format: double
          default: 0.2
          minimum: 0
          maximum: 2
          description: Effective sampling temperature.
        timeout_ms:
          type: integer
          default: 600000
          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Total request time in milliseconds. Zero disables this limit; omitted updates preserve the stored value. New providers default to 10 minutes.
        first_response_timeout_ms:

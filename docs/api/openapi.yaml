        api_key:
          type: string
          writeOnly: true
          description: Unsaved provider credential, used for this request only and never returned. Required for a new or changed URL.
        timeout_ms:
          type: integer
          default: 600000
          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Total request time in milliseconds. Zero disables this limit; omitted updates preserve the stored value. New providers default to 10 minutes.
        first_response_timeout_ms:
          type: integer
          default: 180000
          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Wait for the first response body data including connection time. Zero disables this limit. Omitted updates preserve the stored value.
        idle_timeout_ms:
          type: integer
          default: 120000
          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Maximum gap between response body data; streaming data and heartbeats renew it. Zero disables this limit. Omitted updates preserve the stored value.

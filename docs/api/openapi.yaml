          type: string
          format: date-time
          description: Optional expiry strictly later than the backend's current time.
    AIProviderRequest:
      type: object
      additionalProperties: false
      required: [name, base_url, model, api_mode, enabled]
      properties:
        name:
          type: string
          description: Human-readable provider name.
        base_url:
          type: string
          format: uri
          description: OpenAI-compatible base URL. The backend normalizes it to the supported API path for the selected api_mode.
        model:
          type: string
          description: Provider model name sent to the upstream provider.
        api_mode:
          type: string
          enum: [chat_completions, responses]
          description: Selects OpenAI chat completions payloads or OpenAI responses payloads.
        api_key:
          type: string
          writeOnly: true
          description: Raw provider API key. Encrypted for storage and excluded from ordinary provider responses and audit metadata. An explicit audited reveal endpoint can return it to authorized administrators.
        enabled:
          type: boolean
          description: Whether this provider can be used for summaries and chat.
        stream:
          type: boolean
          default: true
          description: Stream upstream Responses or Chat Completions calls for tests, summaries and chat. New and historical configurations default to true. An omitted update preserves the saved setting; false requests non-streaming responses.
        temperature:
          type: number
          format: double
          default: 0.2
          minimum: 0
          maximum: 2
          description: Sampling temperature. Omit to use 0.2. Values from 0 through 2 are accepted.
        timeout_ms:
          type: integer
          default: 600000
          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Total request time in milliseconds. Zero disables this limit; omitted updates preserve the stored value. New providers default to 10 minutes.
        first_response_timeout_ms:
          type: integer
          default: 180000
          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Wait for the first response body data including connection time. Zero disables this limit. Omitted updates preserve the stored value.
        idle_timeout_ms:
          type: integer
          default: 120000
          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Maximum gap between response body data; streaming data and heartbeats renew it. Zero disables this limit. Omitted updates preserve the stored value.
        max_output_tokens:
          type: integer
          default: 1000
          minimum: 1
          maximum: 32000
          description: Maximum generated output tokens. Omit to use 1000. Values from 1 through 32000 are accepted.
    AIProviderModelsRequest:
      type: object

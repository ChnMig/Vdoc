      - { $ref: "#/components/parameters/AIPromptKey" }
    put:
      tags: [AI]
      summary: Upsert a project AI prompt override.
      description: Project Admin or SuperAdmin only, and the project must be active. The path supplies prompt_key; the body supplies only editable prompt content. Every user_prompt_template must contain {{context}}, and page_chat must also contain {{message}}. Archived project prompt configuration cannot be changed.
      operationId: putProjectAIPrompt
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIPromptRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }

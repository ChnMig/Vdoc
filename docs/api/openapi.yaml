      properties:
        reasoning_effort: { $ref: "#/components/schemas/AIReasoningEffort" }
    AIReasoningEffort:
      type: string
      enum: ["", none, minimal, low, medium, high, xhigh, max]
    AIChatSessionRequest:
      type: object
      additionalProperties: false
      required: [document_id, context_type, context_id]
      properties:
        document_id: { type: string }
        context_type: { type: string, enum: [draft, version, diff, document] }
        context_id: { type: string, description: Document context requires the same value as document_id. }
        title: { type: string }
        reasoning_effort: { $ref: "#/components/schemas/AIReasoningEffort" }
    AIChatMessageRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [content]
          properties:
            content: { minLength: 1 }
        - required: [attachments]
          properties:
            attachments: { minItems: 1 }
        - required: [retry_of]
          properties:
            retry_of: { minLength: 1 }
      properties:
        content: { type: string, maxLength: 4000 }
        retry_of: { type: string, minLength: 1, description: Latest effective assistant message ID to regenerate. Content must be empty and attachments absent. }
        attachments:
          type: array
          maxItems: 4
          description: Inline attachments; each decoded file is at most 4 MiB, combined at most 6 MiB. Text files are UTF-8 and at most 100 KiB.

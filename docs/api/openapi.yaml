components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw JWT string issued by login or register.
    MCPTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw MCP token string issued by the private MCP token APIs.
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: {type: string}
      description: Project ID.
    DocumentID:
      name: document_id
      in: path
      required: true
      schema: {type: string}
      description: Document ID.
    BranchID:
      name: branch_id
      in: path
      required: true
      schema: {type: string}
      description: Branch ID.
    DraftID:
      name: draft_id
      in: path
      required: true
      schema: {type: string}
      description: Draft ID.
    VersionID:
      name: version_id
      in: path
      required: true
      schema: {type: string}
      description: Published document version ID.
    EndpointID:
      name: endpoint_id
      in: path
      required: true
      schema: {type: string}
      description: Parsed endpoint ID.
    DiffID:
      name: diff_id
      in: path
      required: true
      schema: {type: string}
      description: Diff ID.
    TokenID:
      name: token_id
      in: path
      required: true
      schema: {type: string}
      description: MCP token ID.
    UserID:
      name: user_id
      in: path
      required: true
      schema: {type: string}
      description: User ID.
    TeamID:
      name: team_id
      in: path
      required: true
      schema: {type: string}
      description: Team ID.
    ContentKind:
      name: content_kind
      in: path
      required: true
      schema:
        type: string
        enum: [raw, normalized, stable]
      description: Selects raw, normalized OpenAPI, or stable Markdown content.
    AIPromptKey:
      name: prompt_key
      in: path
      required: true
      schema:
        type: string
        enum: [draft_review_summary, version_change_summary, diff_change_summary, page_chat]
      description: AI prompt key.
    AIChatSessionID:
      name: session_id
      in: path
      required: true
      schema: {type: string}
      description: AI chat session ID.
  responses:
    VdocEnvelopeResponse:
      description: HTTP 200 response with Vdoc envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VdocEnvelope'}
    VdocListEnvelopeResponse:
      description: HTTP 200 response with Vdoc envelope and total count.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VdocListEnvelope'}
    OpenAPISpecResponse:
      description: Checked-in OpenAPI YAML bytes.
      content:
        application/yaml:
          schema: {type: string}
    MCPJSONRPCResponse:
      description: HTTP 200 response containing a JSON-RPC success or error object.
      content:
        application/json:
          schema: {type: object}
  schemas:
    VdocEnvelope:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        description: {type: string}
        message: {type: string}
        trace_id: {type: string}
        timestamp: {type: integer}
        detail: {}
    VdocListEnvelope:
      allOf:
        - {$ref: '#/components/schemas/VdocEnvelope'}
        - type: object
          properties:
            total: {type: integer}
    AIProviderRequest:
      type: object
      additionalProperties: false
      required: [name, base_url, model, api_mode, enabled]
      properties:
        name:
          type: string
          description: Human-readable provider name.
        base_url:
          type: string
          format: uri
          description: OpenAI-compatible base URL. The backend normalizes it to the supported API path for the selected api_mode.
        model:
          type: string
          description: Provider model name sent to the upstream provider.
        api_mode:
          type: string
          enum: [chat_completions, responses]
          description: Selects OpenAI chat completions payloads or OpenAI responses payloads.
        api_key:
          type: string
          writeOnly: true
          description: Raw provider API key. It is encrypted for storage and never returned by API responses or audit metadata.
        enabled:
          type: boolean
          description: Whether this provider can be used for summaries and chat.
        temperature:
          type: number
          format: double
          default: 0.2
          minimum: 0
          maximum: 2
          description: Sampling temperature. Omit to use 0.2. Values from 0 through 2 are accepted.
        timeout_ms:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 120000
          description: Provider request timeout in milliseconds. Omit to use 30000. Values from 1000 through 120000 are accepted.
        max_output_tokens:
          type: integer
          default: 1000
          minimum: 1
          maximum: 32000
          description: Maximum generated output tokens. Omit to use 1000. Values from 1 through 32000 are accepted.
    AIProviderResponse:
      type: object
      additionalProperties: false
      required: [api_key_set, enabled, temperature, timeout_ms, max_output_tokens]
      properties:
        id: {type: string}
        scope:
          type: string
          enum: [system, project]
        project_id: {type: string}
        name: {type: string}
        base_url: {type: string}
        model: {type: string}
        api_mode:
          type: string
          enum: [chat_completions, responses]
        api_key_set:
          type: boolean
          description: True when an encrypted provider API key is stored.
        api_key_last4:
          type: string
          description: Last four characters of the stored provider key, returned for operator confirmation only.
        enabled: {type: boolean}
        temperature:
          type: number
          format: double
          default: 0.2
          minimum: 0
          maximum: 2
          description: Effective sampling temperature.
        timeout_ms:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 120000
          description: Effective provider timeout in milliseconds.
        max_output_tokens:
          type: integer
          default: 1000
          minimum: 1
          maximum: 32000
          description: Effective output token cap.
    AIProviderTestResult:
      type: object
      additionalProperties: false
      required: [ok, content]
      properties:
        ok: {type: boolean}
        content:
          type: string
          description: Provider connectivity check response text.
    AISummaryResponse:
      type: object
      additionalProperties: false
      required: [id, project_id, document_id, owner_type, owner_id, prompt_key, status, generated_by, generated_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        document_id: {type: string}
        owner_type:
          type: string
          enum: [draft, version, diff]
        owner_id: {type: string}
        prompt_key:
          type: string
          enum: [draft_review_summary, version_change_summary, diff_change_summary]
        provider_id: {type: string}
        status:
          type: string
          enum: [skipped, succeeded, failed]
          description: skipped and failed records are persisted for diagnostics and do not block draft submit or version publish.
        content: {type: string}
        error_message:
          type: string
          description: Non-secret provider, prompt, or configuration failure summary for skipped and failed records.
        generated_by: {type: string}
        generated_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MCPToolName:
      type: string
      enum:
        - list_projects
        - list_documents
        - list_api_versions
        - get_latest_schema
        - get_endpoint_detail
        - compare_api_versions
        - get_change_summary
        - create_api_version_draft
        - update_api_version_draft
        - submit_api_version_draft
        - get_api_version_draft
        - get_latest_doc
        - compare_doc_versions
        - create_doc_draft
        - update_doc_draft
        - submit_doc_draft
        - get_doc_draft

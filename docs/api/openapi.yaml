    MCPDraftCreateArguments:
      allOf:
        - $ref: '#/components/schemas/MCPServiceArguments'
        - type: object
          required: [branch_id, version_name, schema_content]
          properties:
            branch_id:
              type: string
            version_name:
              type: string
            changelog:
              type: string
            source_git_commit_id:
              type: string
            schema_content:
              type: string
    MCPDraftUpdateArguments:
      allOf:
        - $ref: '#/components/schemas/MCPDraftCreateArguments'
        - type: object
          required: [draft_id]
          properties:
            draft_id:
              type: string
    MCPDraftIDArguments:
      allOf:
        - $ref: '#/components/schemas/MCPServiceArguments'
        - type: object
          required: [draft_id]
          properties:
            draft_id:
              type: string
    MCPToolDefinition:
      type: object
      required: [name, description, inputSchema]
      properties:
        name:
          $ref: '#/components/schemas/MCPToolName'
        description:
          type: string
        inputSchema:
          type: object
    MCPJSONRPCSuccessResponse:
      type: object
      required: [jsonrpc, id, result]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          oneOf:
            - $ref: '#/components/schemas/MCPToolsListResult'
            - $ref: '#/components/schemas/MCPToolResult'
    MCPToolsListResult:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPToolDefinition'
    MCPToolResult:
      description: Result returned by the selected MCP tool.
    MCPJSONRPCErrorResponse:
      type: object
      required: [jsonrpc, id, error]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
            - type: string
            - type: integer
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              enum: [-32600, -32601, -32602, -32001, -32003, -32004, -32009, -32099]
            message:
              type: string
            data: {}
    MCPLegacyRequest:
      type: object
      required: [tool, arguments]
      properties:
        tool:
          $ref: '#/components/schemas/MCPToolName'
        arguments:
          $ref: '#/components/schemas/MCPToolArguments'
    MCPLegacyResponse:
      allOf:
        - $ref: '#/components/schemas/VdocEnvelope'
        - type: object
          properties:
            detail:
              type: object
              required: [tool, result]
              properties:
                tool:
                  $ref: '#/components/schemas/MCPToolName'
                result: {}

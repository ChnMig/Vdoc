        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/mcp-tokens:
    get:
      tags: [MCP Tokens]
      summary: List MCP tokens.
      operationId: listMCPTokens
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
    post:
      tags: [MCP Tokens]
      summary: Create MCP token.
      description: Returns a copyable token on create. At least one explicit scope is required, and expires_at must be in the future when supplied. The owner can reveal an active token again with the detail endpoint; list, revoked, and expired responses are redacted.
      operationId: createMCPToken
      security: [{ JWTAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMCPTokenRequest" }
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/mcp-usage:
    get:
      tags: [MCP Tokens]
      summary: List sanitized MCP tool activity.
      description: Returns newest-first `mcp.tool_call` audit evidence for MCP tokens owned by the authenticated user. Supplying `token_id` selects one owned token; a SuperAdmin may use that parameter to inspect any user's token. Without `token_id`, even a SuperAdmin sees only activity for their own tokens. Results default to 100 and are capped at 200. Metadata is allowlisted to tool/adapter/result/reason plus referenced entity IDs and token ID. Entity IDs are retained only for successful tool calls, so caller-supplied IDs from failed requests cannot become entity evidence. IP address and User-Agent are removed, and raw token secrets, schemas, Markdown content, and request arguments are never returned.
      operationId: listMCPUsage
      security: [{ JWTAuth: [] }]
      parameters:
        - {
            name: token_id,
            in: query,
            required: false,
            schema: { type: string },
            description: MCP token ID. Non-SuperAdmins may select only a token they own.,
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200, default: 100 },
          }
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
  /api/v1/private/mcp-tokens/{token_id}:
    parameters:
      - { $ref: "#/components/parameters/TokenID" }
    get:
      tags: [MCP Tokens]
      summary: Get MCP token.
      operationId: getMCPToken
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/mcp-tokens/{token_id}/revoke:
    parameters:
      - { $ref: "#/components/parameters/TokenID" }
    post:
      tags: [MCP Tokens]
      summary: Revoke MCP token.
      operationId: revokeMCPToken
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw JWT string issued by login or register.
    MCPTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw MCP token string issued by the private MCP token APIs.
    DocumentShareAuth:
      type: apiKey
      in: header
      name: Authorization
      description: VdocShare scheme carrying the fragment-derived document-share capability. Protected links also require X-Vdoc-Share-Unlock after password exchange.
  parameters:
    BranchIDQuery:
      name: branch_id
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: Filter drafts or versions to one document branch.
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string }
      description: Project ID.
    DocumentID:
      name: document_id
      in: path
      required: true
      schema: { type: string }
      description: Document ID.
    BranchID:
      name: branch_id
      in: path
      required: true
      schema: { type: string }
      description: Branch ID.
    DraftID:
      name: draft_id
      in: path
      required: true
      schema: { type: string }
      description: Draft ID.
    VersionID:
      name: version_id
      in: path
      required: true
      schema: { type: string }
      description: Published document version ID.
    ShareID:
      name: share_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
      description: Public document share ID. The capability secret is never placed in this path.
    EndpointID:
      name: endpoint_id
      in: path
      required: true
      schema: { type: string }
      description: Parsed endpoint ID.
    DiffID:
      name: diff_id
      in: path
      required: true
      schema: { type: string }
      description: Diff ID.
    TokenID:
      name: token_id
      in: path
      required: true
      schema: { type: string }
      description: MCP token ID.
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string }
      description: User ID.
    TeamID:
      name: team_id
      in: path
      required: true
      schema: { type: string }
      description: Team ID.
    ContentKind:
      name: content_kind
      in: path
      required: true
      schema:
        type: string
        enum: [raw, normalized, stable]
      description: Selects raw, normalized OpenAPI, or stable Markdown content.
    AIPromptKey:
      name: prompt_key
      in: path
      required: true
      schema:
        type: string
        enum:
          [
            draft_review_summary,
            version_change_summary,
            diff_change_summary,
            page_chat,
          ]
      description: AI prompt key.
    AIChatSessionID:
      name: session_id
      in: path
      required: true
      schema: { type: string }
      description: AI chat session ID.
    AIChatDocumentIDQuery:
      name: document_id
      in: query
      required: true
      schema: { type: string }
      description: Document ID for the exact AI page context.
    AIChatContextTypeQuery:
      name: context_type
      in: query
      required: true
      schema:
        type: string
        enum: [draft, version, diff]
      description: AI page context type.
    AIChatContextIDQuery:
      name: context_id
      in: query
      required: true
      schema: { type: string }
      description: Draft, version, or Diff ID for the exact AI page context.
  responses:
    VdocEnvelopeResponse:
      description: HTTP 200 response with Vdoc envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VdocEnvelope" }
    VdocListEnvelopeResponse:
      description: HTTP 200 response with Vdoc envelope and total count.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VdocListEnvelope" }
    OpenAPISpecResponse:
      description: Checked-in OpenAPI YAML bytes.
      content:
        application/yaml:
          schema: { type: string }
    MCPJSONRPCResponse:
      description: HTTP 200 response containing a JSON-RPC success or error object.
      content:
        application/json:
          schema: { type: object }
    PublicDocumentDownloadResponse:
      description: Authorized immutable raw OpenAPI or Markdown bytes with an attachment Content-Disposition header.
      headers:
        Content-Disposition:
          schema: { type: string }
      content:
        application/json:
          schema: { type: string, format: binary }
        application/yaml:
          schema: { type: string, format: binary }
        text/markdown:
          schema: { type: string, format: binary }
  schemas:
    VdocEnvelope:
      type: object
      properties:
        code: { type: integer }
        status: { type: string }
        description: { type: string }
        message: { type: string }
        trace_id: { type: string }
        timestamp: { type: integer }
        detail: {}
    VdocListEnvelope:
      allOf:
        - { $ref: "#/components/schemas/VdocEnvelope" }
        - type: object
          properties:
            total: { type: integer }
    AuthRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password:
          type: string
          format: password
          description: UTF-8 encoding must be 12 to 72 bytes with no leading or trailing whitespace.
    MCPCallRequest:
      type: object
      description: JSON-RPC 2.0 tools/list or tools/call request, or the documented legacy tool bridge object.
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id: {}
        method: { type: string, enum: [tools/list, tools/call] }
        params: { type: object }
        tool: { $ref: "#/components/schemas/MCPToolName" }
        arguments: { type: object }
    DocumentShareUnlockRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, name, password, is_super_admin]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password:
          type: string
          format: password
          description: UTF-8 encoding must be 12 to 72 bytes with no leading or trailing whitespace.
        is_super_admin: { type: boolean }
    PatchUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: integer, enum: [1, 2] }
        is_super_admin: { type: boolean }
    NameDescriptionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    PatchNameDescriptionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [team_id, name]
      properties:
        team_id: { type: string }
        name: { type: string, minLength: 1 }
        description: { type: string }
        admin_user_id:
          type: string
          description: Optional active user to assign as initial Project Admin; omitted or blank selects the acting SuperAdmin.
    AddProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: { type: string }
        role: { type: integer, enum: [1, 2, 3] }
    PatchProjectMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: integer, enum: [1, 2, 3] }
    DocumentRequest:
      type: object
      additionalProperties: false
      required: [name, document_type, relative_path]
      properties:
        name: { type: string, minLength: 1 }
        document_type: { type: integer, enum: [1, 2] }
        relative_path: { type: string, minLength: 1 }
        description: { type: string }
    PatchDocumentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        relative_path: { type: string, minLength: 1 }
        description: { type: string }
    CreateDocumentShareRequest:
      type: object
      additionalProperties: false
      required: [branch_id, version_scope, expiry_preset]
      properties:
        branch_id: { type: string }
        version_scope: { type: integer, enum: [1, 2] }
        expiry_preset:
          type: string
          enum: [1_month, 3_months, 6_months, 1_year, permanent]
        password: { type: string }
    CreateBranchRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^(dev|test|prod|feature/.+)$"
        description: { type: string }
    PatchBranchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          pattern: "^(dev|test|prod|feature/.+)$"
        description: { type: string }
        is_default: { type: boolean }
        is_protected: { type: boolean }
    DraftRequest:
      type: object
      additionalProperties: false
      required: [branch_id, version_name]
      anyOf:
        - required: [schema_content]
        - required: [content]
      properties:
        branch_id: { type: string }
        version_name: { type: string, minLength: 1 }
        changelog: { type: string }
        source_git_commit_id: { type: string }
        schema_content:
          type: string
          description: OpenAPI source content. The handler also accepts this field for Markdown clients.
        content:
          type: string
          description: Markdown source content; used when schema_content is empty.
    PatchDraftRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [schema_content]
        - required: [content]
      properties:
        version_name: { type: string, minLength: 1 }
        changelog: { type: string }
        source_git_commit_id: { type: string }
        schema_content:
          type: string
          description: Updated OpenAPI source content. The handler also accepts this field for Markdown clients.
        content:
          type: string
          description: Updated Markdown source content; used when schema_content is empty.
    ReviewRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 1000 }
    PromoteDraftRequest:
      type: object
      additionalProperties: false
      required: [source_branch_id, target_branch_id, version_name]
      properties:
        source_branch_id: { type: string }
        target_branch_id: { type: string }
        version_name: { type: string, minLength: 1 }
        changelog: { type: string }
    CreateDiffRequest:
      type: object
      additionalProperties: false
      required: [from_version_id, to_version_id]
      properties:
        from_version_id: { type: string }
        to_version_id: { type: string }
    AIChatSessionRequest:
      type: object
      additionalProperties: false
      required: [document_id, context_type, context_id]
      properties:
        document_id: { type: string }
        context_type: { type: string, enum: [draft, version, diff] }
        context_id: { type: string }
        title: { type: string }
    AIChatMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
    CreateMCPTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1 }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, enum: [1, 2, 3, 4] }
        expires_at:
          type: string
          format: date-time
          description: Optional expiry strictly later than the backend's current time.
    AIProviderRequest:
      type: object
      additionalProperties: false
      required: [name, base_url, model, api_mode, enabled]
      properties:
        name:
          type: string
          description: Human-readable provider name.
        base_url:
          type: string
          format: uri
          description: OpenAI-compatible base URL. The backend normalizes it to the supported API path for the selected api_mode.
        model:
          type: string
          description: Provider model name sent to the upstream provider.
        api_mode:
          type: string
          enum: [chat_completions, responses]
          description: Selects OpenAI chat completions payloads or OpenAI responses payloads.
        api_key:
          type: string
          writeOnly: true
          description: Raw provider API key. It is encrypted for storage and never returned by API responses or audit metadata.
        enabled:
          type: boolean
          description: Whether this provider can be used for summaries and chat.
        temperature:
          type: number
          format: double
          default: 0.2
          minimum: 0
          maximum: 2
          description: Sampling temperature. Omit to use 0.2. Values from 0 through 2 are accepted.
        timeout_ms:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 120000
          description: Provider request timeout in milliseconds. Omit to use 30000. Values from 1000 through 120000 are accepted.
        max_output_tokens:
          type: integer
          default: 1000
          minimum: 1
          maximum: 32000
          description: Maximum generated output tokens. Omit to use 1000. Values from 1 through 32000 are accepted.
    AIProviderResponse:
      type: object
      additionalProperties: false
      required:
        [api_key_set, enabled, temperature, timeout_ms, max_output_tokens]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [system, project]
        project_id: { type: string }
        name: { type: string }
        base_url: { type: string }
        model: { type: string }
        api_mode:
          type: string
          enum: [chat_completions, responses]
        api_key_set:
          type: boolean
          description: True when an encrypted provider API key is stored.
        api_key_last4:
          type: string
          description: Last four characters of the stored provider key, returned for operator confirmation only.
        enabled: { type: boolean }
        temperature:
          type: number
          format: double
          default: 0.2
          minimum: 0
          maximum: 2
          description: Effective sampling temperature.
        timeout_ms:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 120000
          description: Effective provider timeout in milliseconds.
        max_output_tokens:
          type: integer
          default: 1000
          minimum: 1
          maximum: 32000
          description: Effective output token cap.
    AIPromptRequest:
      type: object
      additionalProperties: false
      required: [system_prompt, user_prompt_template, enabled]
      properties:
        system_prompt:
          type: string
          minLength: 1
          description: Non-blank operator prompt. The backend appends an immutable guard that prevents AI review or publication actions.
        user_prompt_template:
          type: string
          minLength: 1
          description: Non-blank template. Every prompt key requires the literal {{context}} placeholder; page_chat additionally requires the literal {{message}} placeholder.
        enabled:
          type: boolean
          description: Whether this prompt can be used. A disabled summary prompt records generation as skipped without blocking draft submission or version publishing.
    AIProviderTestResult:
      type: object
      additionalProperties: false
      required: [ok, content]
      properties:
        ok: { type: boolean }
        content:
          type: string
          description: Provider connectivity check response text.
    AISummaryResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          project_id,
          document_id,
          owner_type,
          owner_id,
          prompt_key,
          status,
          generated_by,
          generated_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        project_id: { type: string }
        document_id: { type: string }
        owner_type:
          type: string
          enum: [draft, version, diff]
        owner_id: { type: string }
        prompt_key:
          type: string
          enum:
            [draft_review_summary, version_change_summary, diff_change_summary]
        provider_id: { type: string }
        status:
          type: string
          enum: [pending, skipped, succeeded, failed]
          description: pending marks the latest in-flight request; skipped and failed records are persisted for diagnostics and do not block draft submit or version publish.
        content: { type: string }
        error_message:
          type: string
          description: Non-secret provider, prompt, or configuration failure summary for skipped and failed records.
        generated_by: { type: string }
        generated_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MCPToolName:
      type: string
      enum:
        - list_projects
        - list_documents
        - list_api_versions
        - list_doc_versions
        - get_latest_schema
        - get_endpoint_detail
        - compare_api_versions
        - get_change_summary
        - create_api_version_draft
        - update_api_version_draft
        - submit_api_version_draft
        - get_api_version_draft
        - get_latest_doc
        - compare_doc_versions
        - create_doc_draft
        - update_doc_draft
        - submit_doc_draft
        - get_doc_draft

          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Wait for the first response body data including connection time. Zero disables this limit. Omitted updates preserve the stored value.
        idle_timeout_ms:
          type: integer
          default: 120000
          minimum: 0
          maximum: 2147483647
          not: { minimum: 1, maximum: 999 }
          description: Maximum gap between response body data; streaming data and heartbeats renew it. Zero disables this limit. Omitted updates preserve the stored value.
        max_output_tokens:
          type: integer
          default: 1000
          minimum: 1
          maximum: 32000

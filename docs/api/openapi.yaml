      responses:
        "200": { $ref: "#/components/responses/VdocEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/documents/{document_id}/diffs/{diff_id}/ai-summary/regenerate:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/DocumentID" }
      - { $ref: "#/components/parameters/DiffID" }
    post:
      tags: [AI]
      summary: Regenerate an AI summary for a diff.
      operationId: regenerateDiffAISummary
      security: [{ JWTAuth: [] }]
      responses:

      - {$ref: '#/components/parameters/DiffID'}
    get:
      tags: [Diffs]
      summary: Get document diff summary.
      operationId: getDocumentDiffSummary
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/ai/provider:
    get:
      tags: [AI]
      summary: Get system AI provider configuration.
      description: Returns provider detail using AIProviderResponse. The response includes tuning fields temperature, timeout_ms, and max_output_tokens, plus redacted key state through api_key_set and api_key_last4.
      operationId: getSystemAIProvider
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
    put:
      tags: [AI]
      summary: Upsert system AI provider configuration.
      description: Saves an OpenAI-compatible provider. Omitted tuning fields use defaults from AIProviderRequest. The raw api_key is accepted only in the request and is never returned.
      operationId: putSystemAIProvider
      security: [{JWTAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIProviderRequest'}
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/ai/provider/test:
    post:
      tags: [AI]
      summary: Test the system AI provider without exposing its API key.
      description: Tests the saved provider when the body is omitted, or tests the supplied AIProviderRequest without exposing the API key. Audit metadata records token usage when the provider returns usage fields and excludes secrets.
      operationId: testSystemAIProvider
      security: [{JWTAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIProviderRequest'}
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/ai/provider:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
    get:
      tags: [AI]
      summary: Get project AI provider configuration.
      description: Returns the project override provider detail using AIProviderResponse when one is configured. Provider response fields include tuning values and redacted key metadata only.
      operationId: getProjectAIProvider
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
    put:
      tags: [AI]
      summary: Upsert project AI provider configuration.
      description: Saves a project-level provider override with the same AIProviderRequest tuning defaults and ranges as the system provider.
      operationId: putProjectAIProvider
      security: [{JWTAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIProviderRequest'}
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/ai/provider/test:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
    post:
      tags: [AI]
      summary: Test the effective project AI provider.
      description: Tests the effective project provider, falling back to the system provider when no enabled project override exists. A request body may supply AIProviderRequest for a one-off test.
      operationId: testProjectAIProvider
      security: [{JWTAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIProviderRequest'}
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/ai/prompts:
    get:
      tags: [AI]
      summary: List effective system AI prompts.
      operationId: listSystemAIPrompts
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
  /api/v1/private/ai/prompts/{prompt_key}:
    parameters:
      - {$ref: '#/components/parameters/AIPromptKey'}
    put:
      tags: [AI]
      summary: Upsert a system AI prompt override.
      operationId: putSystemAIPrompt
      security: [{JWTAuth: []}]
      responses:

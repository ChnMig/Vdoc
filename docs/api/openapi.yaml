      operationId: listProjectAIPrompts
      security: [{ JWTAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/VdocListEnvelopeResponse" }
  /api/v1/private/projects/{project_id}/ai/prompts/{prompt_key}:
    parameters:

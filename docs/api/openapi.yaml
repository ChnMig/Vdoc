openapi: 3.1.0
info:
  title: Vdoc API
  version: 0.1.0
  description: Machine-readable contract for the Vdoc v0.1 HTTP API. Projects own typed Documents, including OpenAPI and Markdown. REST handlers return HTTP 200 with the semantic result in the Vdoc envelope body.
servers:
  - url: /
security: []
tags:
  - name: Open
    description: Public health, authentication, docs, and MCP entry points.
  - name: Identity
    description: Current user identity.
  - name: System Users
    description: Super admin user lifecycle and user MCP token oversight.
  - name: Teams
    description: Team lifecycle.
  - name: Projects
    description: Project lifecycle and membership.
  - name: Documents
    description: Project document lifecycle.
  - name: Branches
    description: Document branch lifecycle.
  - name: Drafts
    description: Document draft creation, update, review, and promotion.
  - name: Versions
    description: Published document versions and stored content.
  - name: Endpoints
    description: Parsed endpoint data from published document versions.
  - name: Diffs
    description: Document version comparison.
  - name: MCP Tokens
    description: User MCP token lifecycle.
paths:
  /api/v1/open/health:
    get:
      tags: [Open]
      summary: Get health.
      operationId: getOpenHealth
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/open/auth/register:
    post:
      tags: [Open]
      summary: Register a user and issue a JWT.
      operationId: registerAuth
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/open/auth/login:
    post:
      tags: [Open]
      summary: Authenticate a user and issue a JWT.
      operationId: loginAuth
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/open/docs/openapi.yaml:
    get:
      tags: [Open]
      summary: Serve this OpenAPI YAML document.
      operationId: getOpenAPISpec
      responses:
        '200': {$ref: '#/components/responses/OpenAPISpecResponse'}
  /api/v1/open/mcp:
    post:
      tags: [Open]
      summary: Call MCP tools through JSON-RPC 2.0.
      operationId: callMCP
      security:
        - MCPTokenAuth: []
      responses:
        '200': {$ref: '#/components/responses/MCPJSONRPCResponse'}
  /api/v1/private/identity/me:
    get:
      tags: [Identity]
      summary: Get current user.
      operationId: getIdentityMe
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/system/users:
    get:
      tags: [System Users]
      summary: List users.
      operationId: listSystemUsers
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
    post:
      tags: [System Users]
      summary: Create user.
      operationId: createSystemUser
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/system/users/{user_id}:
    parameters:
      - {$ref: '#/components/parameters/UserID'}
    patch:
      tags: [System Users]
      summary: Patch user.
      operationId: patchSystemUser
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/system/users/{user_id}/mcp-tokens:
    parameters:
      - {$ref: '#/components/parameters/UserID'}
    get:
      tags: [System Users]
      summary: List a user's MCP tokens.
      operationId: listSystemUserMCPTokens
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
  /api/v1/private/system/users/{user_id}/mcp-tokens/{token_id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/UserID'}
      - {$ref: '#/components/parameters/TokenID'}
    post:
      tags: [System Users]
      summary: Revoke a user's MCP token.
      operationId: revokeSystemUserMCPToken
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/teams:
    get:
      tags: [Teams]
      summary: List teams.
      operationId: listTeams
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
    post:
      tags: [Teams]
      summary: Create team.
      operationId: createTeam
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/teams/{team_id}:
    parameters:
      - {$ref: '#/components/parameters/TeamID'}
    get:
      tags: [Teams]
      summary: Get team.
      operationId: getTeam
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
    patch:
      tags: [Teams]
      summary: Update team.
      operationId: updateTeam
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/teams/{team_id}/archive:
    parameters:
      - {$ref: '#/components/parameters/TeamID'}
    post:
      tags: [Teams]
      summary: Archive team.
      operationId: archiveTeam
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects:
    get:
      tags: [Projects]
      summary: List projects.
      operationId: listProjects
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
    post:
      tags: [Projects]
      summary: Create project.
      operationId: createProject
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
    get:
      tags: [Projects]
      summary: Get project.
      operationId: getProject
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
    patch:
      tags: [Projects]
      summary: Update project.
      operationId: updateProject
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/archive:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
    post:
      tags: [Projects]
      summary: Archive project.
      operationId: archiveProject
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/members:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
    get:
      tags: [Projects]
      summary: List project members.
      operationId: listProjectMembers
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
    post:
      tags: [Projects]
      summary: Add project member.
      operationId: addProjectMember
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/members/{user_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/UserID'}
    delete:
      tags: [Projects]
      summary: Remove project member.
      operationId: removeProjectMember
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/members/{user_id}/role:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/UserID'}
    patch:
      tags: [Projects]
      summary: Change project member role.
      operationId: patchProjectMemberRole
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
    get:
      tags: [Documents]
      summary: List project documents.
      operationId: listProjectDocuments
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
    post:
      tags: [Documents]
      summary: Create project document.
      description: Creates a typed Document. document_type 1 is OpenAPI and 2 is Markdown. relative_path is the stored project-local path identity.
      operationId: createProjectDocument
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
    get:
      tags: [Documents]
      summary: Get project document.
      operationId: getProjectDocument
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
    patch:
      tags: [Documents]
      summary: Update project document.
      operationId: updateProjectDocument
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/archive:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
    post:
      tags: [Documents]
      summary: Archive project document.
      operationId: archiveProjectDocument
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/branches:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
    get:
      tags: [Branches]
      summary: List document branches.
      operationId: listDocumentBranches
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
    post:
      tags: [Branches]
      summary: Create document branch.
      operationId: createDocumentBranch
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/branches/{branch_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/BranchID'}
    get:
      tags: [Branches]
      summary: Get document branch.
      operationId: getDocumentBranch
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
    patch:
      tags: [Branches]
      summary: Update document branch.
      operationId: updateDocumentBranch
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/branches/{branch_id}/archive:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/BranchID'}
    post:
      tags: [Branches]
      summary: Archive document branch.
      operationId: archiveDocumentBranch
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
    get:
      tags: [Drafts]
      summary: List document drafts.
      operationId: listDocumentDrafts
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
    post:
      tags: [Drafts]
      summary: Create document draft.
      operationId: createDocumentDraft
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts/{draft_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/DraftID'}
    get:
      tags: [Drafts]
      summary: Get document draft.
      operationId: getDocumentDraft
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
    patch:
      tags: [Drafts]
      summary: Update document draft.
      operationId: updateDocumentDraft
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts/{draft_id}/content/{content_kind}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/DraftID'}
      - {$ref: '#/components/parameters/ContentKind'}
    get:
      tags: [Drafts]
      summary: Get document draft content.
      operationId: getDocumentDraftContent
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts/{draft_id}/submit:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/DraftID'}
    post:
      tags: [Drafts]
      summary: Submit document draft.
      operationId: submitDocumentDraft
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts/{draft_id}/approve:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/DraftID'}
    post:
      tags: [Drafts]
      summary: Approve document draft.
      operationId: approveDocumentDraft
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts/{draft_id}/request-changes:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/DraftID'}
    post:
      tags: [Drafts]
      summary: Request document draft changes.
      operationId: requestDocumentDraftChanges
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts/{draft_id}/reject:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/DraftID'}
    post:
      tags: [Drafts]
      summary: Reject document draft.
      operationId: rejectDocumentDraft
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/drafts/promote:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
    post:
      tags: [Drafts]
      summary: Promote document draft.
      operationId: promoteDocumentDraft
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/versions:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
    get:
      tags: [Versions]
      summary: List published document versions.
      operationId: listDocumentVersions
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/versions/{version_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/VersionID'}
    get:
      tags: [Versions]
      summary: Get published document version.
      operationId: getDocumentVersion
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/versions/{version_id}/content/{content_kind}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/VersionID'}
      - {$ref: '#/components/parameters/ContentKind'}
    get:
      tags: [Versions]
      summary: Get document version content.
      operationId: getDocumentVersionContent
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/versions/{version_id}/endpoints:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/VersionID'}
    get:
      tags: [Endpoints]
      summary: List endpoints indexed from a document version.
      operationId: listDocumentVersionEndpoints
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/versions/{version_id}/endpoints/{endpoint_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/VersionID'}
      - {$ref: '#/components/parameters/EndpointID'}
    get:
      tags: [Endpoints]
      summary: Get endpoint detail.
      operationId: getDocumentVersionEndpoint
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/diffs:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
    post:
      tags: [Diffs]
      summary: Compare document versions.
      operationId: createDocumentDiff
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/diffs/{diff_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/DiffID'}
    get:
      tags: [Diffs]
      summary: Get document diff.
      operationId: getDocumentDiff
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/projects/{project_id}/documents/{document_id}/diffs/{diff_id}/summary:
    parameters:
      - {$ref: '#/components/parameters/ProjectID'}
      - {$ref: '#/components/parameters/DocumentID'}
      - {$ref: '#/components/parameters/DiffID'}
    get:
      tags: [Diffs]
      summary: Get document diff summary.
      operationId: getDocumentDiffSummary
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/mcp-tokens:
    get:
      tags: [MCP Tokens]
      summary: List MCP tokens.
      operationId: listMCPTokens
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocListEnvelopeResponse'}
    post:
      tags: [MCP Tokens]
      summary: Create MCP token.
      description: Returns the one time copyable token value only on create. List, get, and revoke responses are redacted.
      operationId: createMCPToken
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/mcp-tokens/{token_id}:
    parameters:
      - {$ref: '#/components/parameters/TokenID'}
    get:
      tags: [MCP Tokens]
      summary: Get MCP token.
      operationId: getMCPToken
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
  /api/v1/private/mcp-tokens/{token_id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/TokenID'}
    post:
      tags: [MCP Tokens]
      summary: Revoke MCP token.
      operationId: revokeMCPToken
      security: [{JWTAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VdocEnvelopeResponse'}
components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw JWT string issued by login or register.
    MCPTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw MCP token string issued by the private MCP token APIs.
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: {type: string}
      description: Project ID.
    DocumentID:
      name: document_id
      in: path
      required: true
      schema: {type: string}
      description: Document ID.
    BranchID:
      name: branch_id
      in: path
      required: true
      schema: {type: string}
      description: Branch ID.
    DraftID:
      name: draft_id
      in: path
      required: true
      schema: {type: string}
      description: Draft ID.
    VersionID:
      name: version_id
      in: path
      required: true
      schema: {type: string}
      description: Published document version ID.
    EndpointID:
      name: endpoint_id
      in: path
      required: true
      schema: {type: string}
      description: Parsed endpoint ID.
    DiffID:
      name: diff_id
      in: path
      required: true
      schema: {type: string}
      description: Diff ID.
    TokenID:
      name: token_id
      in: path
      required: true
      schema: {type: string}
      description: MCP token ID.
    UserID:
      name: user_id
      in: path
      required: true
      schema: {type: string}
      description: User ID.
    TeamID:
      name: team_id
      in: path
      required: true
      schema: {type: string}
      description: Team ID.
    ContentKind:
      name: content_kind
      in: path
      required: true
      schema:
        type: string
        enum: [raw, normalized, stable]
      description: Selects raw, normalized OpenAPI, or stable Markdown content.
  responses:
    VdocEnvelopeResponse:
      description: HTTP 200 response with Vdoc envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VdocEnvelope'}
    VdocListEnvelopeResponse:
      description: HTTP 200 response with Vdoc envelope and total count.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VdocListEnvelope'}
    OpenAPISpecResponse:
      description: Checked-in OpenAPI YAML bytes.
      content:
        application/yaml:
          schema: {type: string}
    MCPJSONRPCResponse:
      description: HTTP 200 response containing a JSON-RPC success or error object.
      content:
        application/json:
          schema: {type: object}
  schemas:
    VdocEnvelope:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        description: {type: string}
        message: {type: string}
        trace_id: {type: string}
        timestamp: {type: integer}
        detail: {}
    VdocListEnvelope:
      allOf:
        - {$ref: '#/components/schemas/VdocEnvelope'}
        - type: object
          properties:
            total: {type: integer}
    MCPToolName:
      type: string
      enum:
        - list_projects
        - list_documents
        - list_api_versions
        - get_latest_schema
        - get_endpoint_detail
        - compare_api_versions
        - get_change_summary
        - create_api_version_draft
        - update_api_version_draft
        - submit_api_version_draft
        - get_api_version_draft
        - get_latest_doc
        - compare_doc_versions
        - create_doc_draft
        - update_doc_draft
        - submit_doc_draft
        - get_doc_draft

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres
    environment:
      POSTGRES_DB: vdoc
      POSTGRES_USER: vdoc
      POSTGRES_PASSWORD: rCCKM3prq98j8ej9  # CHANGEME
      TZ: Asia/Shanghai
    volumes:
      - ./data/docker/postgres:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    container_name: rustfs
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=RBIfIs4cVC1V3809 # CHANGEME
      - RUSTFS_SECRET_KEY=Vi17M1OcD5Qj2KeR # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
    volumes:
      - ./data/docker/rustfs/data:/data
      - ./data/docker/rustfs/logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
      VDOC_TEST_DATABASE_DSN: postgres://vdoc_test:vdoc_test@127.0.0.1:5432/vdoc_ci_test?sslmode=disable
      VDOC_POSTGRES_DB: vdoc
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: vdoc_test
          POSTGRES_PASSWORD: vdoc_test
          POSTGRES_DB: vdoc_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vdoc_test -d vdoc_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Verify modules
        run: |
          go mod tidy -diff
          go mod verify

      - name: PostgreSQL integration gate
        run: go test -v ./db -run 'Test(Postgres|RunMigrations)' -count=1

      - name: v0.1 E2E smoke
        run: ./scripts/vdoc-e2e.sh all

      - name: Build binary
        run: go build -trimpath -o /tmp/vdoc-ci .

      - name: Package tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release-package RELEASE_TAG="$RELEASE_TAG"

      - name: Upload verified release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-release
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Backend release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: backend-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name backend-release --dir release

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${options[@]}"
